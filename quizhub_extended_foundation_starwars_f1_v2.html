<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizy osobowości — Bookverse Quiz Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f8fb;
      --bg-soft:#edf2f7;
      --card:#ffffff;
      --line:#d6e0ea;
      --text:#13202d;
      --muted:#5c6d7d;
      --accent:#2e6f96;
      --accent-dark:#215674;
      --accent-soft:#deebf4;
      --shadow:0 20px 48px rgba(12,32,48,.09);
      --pill:999px;
      --radius:28px;

      --u-accent:#2e6f96;
      --u-accent-dark:#215674;
      --u-soft:#deebf4;
      --u-grad-1:#ffffff;
      --u-grad-2:#f8fbfe;
      --u-highlight:#f3f7fb;
    }

    body[data-theme="dark"]{
      --bg:#11161c;
      --bg-soft:#1a2129;
      --card:#171d24;
      --line:#2a3542;
      --text:#e8eef5;
      --muted:#a4b0bd;
      --accent:#8fb7d1;
      --accent-dark:#b5d0e1;
      --accent-soft:#22303b;
      --shadow:0 20px 48px rgba(0,0,0,.34);
    }

    body[data-universe="offcampus"]{
      --u-accent:#b86b8f;
      --u-accent-dark:#9d5276;
      --u-soft:#f8e4ee;
      --u-grad-1:#fffafc;
      --u-grad-2:#fff2f7;
      --u-highlight:#fdf1f6;
    }
    body[data-theme="dark"][data-universe="offcampus"]{
      --u-accent:#d79ab5;
      --u-accent-dark:#ebc3d4;
      --u-soft:#33232b;
      --u-grad-1:#1c171b;
      --u-grad-2:#241c21;
      --u-highlight:#2b2026;
    }
    body[data-universe="got"]{
      --u-accent:#8b2f3f;
      --u-accent-dark:#6f2230;
      --u-soft:#f1dde2;
      --u-grad-1:#fffafb;
      --u-grad-2:#f9ecef;
      --u-highlight:#f7ecef;
    }
    body[data-theme="dark"][data-universe="got"]{
      --u-accent:#c27b87;
      --u-accent-dark:#d9a5ad;
      --u-soft:#311f24;
      --u-grad-1:#1b1719;
      --u-grad-2:#241c1f;
      --u-highlight:#2b2124;
    }
    body[data-universe="hotd"]{
      --u-accent:#9b3b2f;
      --u-accent-dark:#7d2f25;
      --u-soft:#f4e0db;
      --u-grad-1:#fff9f7;
      --u-grad-2:#faece8;
      --u-highlight:#f8eeeb;
    }
    body[data-theme="dark"][data-universe="hotd"]{
      --u-accent:#cf8a7c;
      --u-accent-dark:#e1aea4;
      --u-soft:#34231f;
      --u-grad-1:#1c1716;
      --u-grad-2:#251d1b;
      --u-highlight:#2b211f;
    }
    body[data-universe="knight"]{
      --u-accent:#8a6a2c;
      --u-accent-dark:#715523;
      --u-soft:#f2ead7;
      --u-grad-1:#fffdf8;
      --u-grad-2:#f8f2e5;
      --u-highlight:#faf6eb;
    }
    body[data-theme="dark"][data-universe="knight"]{
      --u-accent:#c7ab72;
      --u-accent-dark:#dbc79c;
      --u-soft:#332b1f;
      --u-grad-1:#1d1915;
      --u-grad-2:#26211b;
      --u-highlight:#2c261f;
    }

    body[data-universe="foundation"]{
      --u-accent:#5d6fb3;
      --u-accent-dark:#465694;
      --u-soft:#e3e8fb;
      --u-grad-1:#f8f9ff;
      --u-grad-2:#eef1fb;
      --u-highlight:#f1f4ff;
    }
    body[data-theme="dark"][data-universe="foundation"]{
      --u-accent:#a7b4ea;
      --u-accent-dark:#c8d1f5;
      --u-soft:#252b40;
      --u-grad-1:#171a24;
      --u-grad-2:#1d2230;
      --u-highlight:#212738;
    }
    body[data-universe="starwars"]{
      --u-accent:#8e6a20;
      --u-accent-dark:#6f5319;
      --u-soft:#f4ead0;
      --u-grad-1:#fffdf8;
      --u-grad-2:#f8f1e3;
      --u-highlight:#faf4e8;
    }
    body[data-theme="dark"][data-universe="starwars"]{
      --u-accent:#d7bf79;
      --u-accent-dark:#ead9a6;
      --u-soft:#332a1c;
      --u-grad-1:#1a1713;
      --u-grad-2:#221d17;
      --u-highlight:#29231b;
    }
    body[data-universe="f1"]{
      --u-accent:#c43b33;
      --u-accent-dark:#9f2f29;
      --u-soft:#f8dfdd;
      --u-grad-1:#fff8f8;
      --u-grad-2:#fbecec;
      --u-highlight:#fdf1f0;
    }
    body[data-theme="dark"][data-universe="f1"]{
      --u-accent:#e28a84;
      --u-accent-dark:#efb1ac;
      --u-soft:#341f1d;
      --u-grad-1:#1c1515;
      --u-grad-2:#251a1a;
      --u-highlight:#2b1f1e;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding:24px 12px 56px;
      transition:background .2s ease,color .2s ease;
    }
    h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;line-height:1.08}
    img{display:block;max-width:100%}
    button{font:inherit;cursor:pointer}

    .topbar{
      width:min(1080px,100%);
      margin:0 auto 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .topbar-left{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .topbar-right{display:flex;gap:10px;flex-wrap:wrap}
    .switcher{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--card);
      box-shadow:var(--shadow);
    }
    body[data-theme="dark"] .switcher{
      background:#171d24;
      border-color:#2b3642;
    }
    .switcher button{
      border:none;
      background:transparent;
      color:var(--muted);
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
    }
    .switcher button.active{
      background:var(--u-soft);
      color:var(--u-accent-dark);
    }

    .step{display:none;width:min(1080px,100%);margin:0 auto;animation:fadeIn .24s ease}
    .step.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .home-body{padding:46px 42px 38px}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      padding:8px 14px;
      border-radius:999px;
      background:var(--u-soft);
      color:var(--u-accent-dark);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.14em;
      margin-bottom:18px;
    }
    .home-title{font-size:clamp(2.5rem,5vw,4.3rem);max-width:13ch;margin-bottom:14px}
    .home-lead{color:var(--muted);max-width:68ch;font-size:1.05rem;line-height:1.6;margin-bottom:28px}

    .universe-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }
    .universe-card{
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px 20px;
      background:linear-gradient(180deg,var(--u-grad-1) 0%,var(--u-grad-2) 100%);
      transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
      cursor:pointer;
      min-height:220px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .universe-card:hover{
      transform:translateY(-4px);
      border-color:var(--u-accent);
      box-shadow:0 18px 40px rgba(12,32,48,.12);
    }
    .universe-badge{
      display:inline-flex;
      width:max-content;
      padding:7px 12px;
      border-radius:999px;
      background:var(--u-soft);
      color:var(--u-accent-dark);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:14px;
    }
    .universe-title{font-size:1.8rem;margin-bottom:10px}
    .universe-subtitle{color:var(--muted);line-height:1.55;font-size:.97rem;margin-bottom:18px}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--u-highlight);
      font-size:13px;
      font-weight:700;
      color:var(--text);
    }

    body[data-theme="dark"] .universe-card{
      background:#171d24;
      border:1px solid #2b3642;
    }
    body[data-theme="dark"] .universe-title{
      color:#eef3f8;
    }
    body[data-theme="dark"] .universe-subtitle{
      color:#aeb9c4;
    }
    body[data-theme="dark"] .universe-badge{
      background:#222d37;
      color:#c5d7e5;
      border:1px solid #313d4a;
    }
    body[data-theme="dark"] .chip{
      background:#1e2630;
      border:1px solid #313d4a;
      color:#d9e3ec;
    }
    body[data-theme="dark"] .universe-card:hover{
      border-color:#425263;
      box-shadow:0 18px 40px rgba(0,0,0,.32);
    }

    .intro-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:0;align-items:stretch}
    .intro-main{padding:42px 40px 34px}
    .intro-side{
      background:linear-gradient(180deg,var(--u-grad-1) 0%,var(--u-grad-2) 100%);
      border-left:1px solid var(--line);
      padding:30px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .intro-title{font-size:clamp(2.1rem,4vw,3.4rem);margin-bottom:12px;max-width:14ch}
    .intro-lead{color:var(--muted);line-height:1.65;max-width:54ch;margin-bottom:28px}
    .intro-actions{display:flex;flex-wrap:wrap;gap:12px}

    .btn-primary,.btn-secondary,.btn-ghost{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:16px 28px;
      font-weight:800;
      border:none;
      transition:transform .14s ease,background .14s ease,border-color .14s ease,color .14s ease;
    }
    .btn-primary{background:var(--u-accent);color:#fff;box-shadow:0 12px 28px rgba(27,106,150,.18)}
    .btn-primary:hover{background:var(--u-accent-dark);transform:translateY(-1px)}
    .btn-secondary,.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
    .btn-secondary:hover,.btn-ghost:hover{border-color:var(--u-accent);color:var(--u-accent)}

    .character-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .character-card{display:grid;gap:8px}
    .portrait{
      aspect-ratio:3/4;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--line);
      background:var(--bg-soft);
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .portrait img{width:100%;height:100%;object-fit:cover}
    .portrait.missing::after{
      content:attr(data-label);
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:12px;
      color:var(--muted);
      font-weight:800;
      font-size:1rem;
      letter-spacing:.02em;
      background:linear-gradient(180deg,var(--u-grad-1) 0%,var(--u-grad-2) 100%);
    }
    .character-name{text-align:center;font-size:13px;font-weight:700;color:var(--muted)}

    .quiz-body{padding:40px 42px 34px}
    .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--muted)}
    .progress-track{height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden;margin-bottom:30px}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--u-soft),var(--u-accent));border-radius:inherit;transition:width .24s ease}
    .q-label{color:var(--u-accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;margin-bottom:12px}
    .q-title{font-size:clamp(1.45rem,2.4vw,2rem);font-weight:800;line-height:1.26;margin-bottom:10px}
    .q-hint{color:var(--muted);font-size:.96rem;margin-bottom:26px}
    .answers{display:grid;gap:10px}
    .answer{
      width:100%;
      text-align:left;
      background:var(--card);
      border:1.5px solid var(--line);
      border-radius:18px;
      padding:18px 18px 16px;
      font-weight:700;
      color:var(--text);
      transition:border-color .14s ease,box-shadow .14s ease,transform .14s ease;
    }
    .answer:hover,.answer:focus-visible{
      outline:none;
      border-color:var(--u-accent);
      box-shadow:0 8px 24px rgba(12,32,48,.08);
      transform:translateY(-1px);
    }
    body[data-theme="dark"] .answer:hover,
    body[data-theme="dark"] .answer:focus-visible{
      box-shadow:0 10px 24px rgba(0,0,0,.24);
    }
    .answer span{display:block;margin-top:5px;font-size:13.5px;font-weight:500;color:var(--muted)}

    .result-grid{display:grid;grid-template-columns:300px 1fr}
    .result-media{background:var(--u-grad-2);min-height:100%}
    body[data-theme="dark"] .result-media{border-right:1px solid var(--line)}
    .result-media .portrait{height:100%;min-height:100%;border:none;border-radius:0;aspect-ratio:auto;background:transparent}
    .result-body{padding:40px 40px 34px}
    .result-name{font-size:clamp(2.1rem,3vw,3.1rem);margin-bottom:12px}
    .result-desc,.result-extra{color:var(--muted);line-height:1.68}
    .result-desc{margin-bottom:14px}
    .result-extra{margin-bottom:20px;font-size:.97rem}
    .traits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
    .trait{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--u-highlight);font-size:13px;font-weight:700}
    .score-list{display:grid;gap:12px;margin-top:10px}
    .score-item{display:grid;gap:6px}
    .score-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text)}
    .score-track{height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden}
    .score-fill{height:100%;background:linear-gradient(90deg,var(--u-soft),var(--u-accent));border-radius:inherit}
    .result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}

    @media(max-width:980px){
      .universe-grid{grid-template-columns:1fr}
      .intro-grid,.result-grid{grid-template-columns:1fr}
      .intro-side{border-left:none;border-top:1px solid var(--line)}
    }
    @media(max-width:680px){
      .home-body,.intro-main,.quiz-body,.result-body{padding:28px 20px 24px}
      .intro-side{padding:22px 20px}
      .character-grid{grid-template-columns:repeat(2,1fr)}
      .result-media .portrait{aspect-ratio:4/3}
      .topbar{align-items:stretch}
    }
  </style>
</head>
<body data-theme="light" data-universe="home">
  <div class="topbar">
    <div class="topbar-left" id="brand-label">Bookverse Quiz Hub</div>
    <div class="topbar-right">
      <div class="switcher" aria-label="Language switcher">
        <button id="lang-pl" class="active" onclick="setLanguage('pl')">PL</button>
        <button id="lang-en" onclick="setLanguage('en')">EN</button>
      </div>
      <div class="switcher" aria-label="Theme switcher">
        <button id="theme-light" class="active" onclick="setTheme('light')">Light</button>
        <button id="theme-dark" onclick="setTheme('dark')">Dark</button>
      </div>
    </div>
  </div>

  <section class="step active" id="step-home">
    <div class="card">
      <div class="home-body">
        <div class="eyebrow" id="home-eyebrow"></div>
        <h1 class="home-title" id="home-title"></h1>
        <p class="home-lead" id="home-lead"></p>
        <div class="universe-grid" id="universe-grid"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-intro">
    <div class="card intro-grid">
      <div class="intro-main">
        <div class="eyebrow" id="intro-badge"></div>
        <h2 class="intro-title" id="intro-title"></h2>
        <p class="intro-lead" id="intro-lead"></p>
        <div class="intro-actions">
          <button class="btn-primary" id="start-btn" onclick="startQuiz()"></button>
          <button class="btn-secondary" id="back-btn" onclick="goHome()"></button>
        </div>
      </div>
      <div class="intro-side">
        <div class="character-grid" id="intro-characters"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-quiz">
    <div class="card">
      <div class="quiz-body">
        <div class="progress-row">
          <span id="q-counter"></span>
          <span id="q-pct">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div id="question-area"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-result">
    <div class="card result-grid">
      <div class="result-media">
        <div class="portrait" id="result-portrait" data-label="Wynik">
          <img id="result-img" src="" alt="Quiz result" onerror="handleMissingImage(this)">
        </div>
      </div>
      <div class="result-body">
        <div class="eyebrow" id="result-badge"></div>
        <h2 class="result-name" id="result-name"></h2>
        <p class="result-desc" id="result-desc"></p>
        <div class="traits" id="result-traits"></div>
        <p class="result-extra" id="result-extra"></p>
        <div id="role-box" style="display:none;margin-bottom:22px;padding:18px 18px 16px;border:1px solid var(--line);border-radius:20px;background:var(--u-highlight)">
          <div class="eyebrow" id="role-title" style="margin-bottom:12px"></div>
          <h3 id="role-name" style="margin-bottom:10px"></h3>
          <p id="role-lead" class="result-extra" style="margin-bottom:10px"></p>
          <p id="role-desc" class="result-desc" style="margin-bottom:10px"></p>
          <div class="traits" id="role-traits" style="margin-bottom:10px"></div>
          <p id="role-extra" class="result-extra" style="margin-bottom:0"></p>
        </div>
        <div>
          <h3 id="score-title"></h3>
          <div class="score-list" id="score-list"></div>
        </div>
        <div class="result-actions">
          <button class="btn-primary" id="restart-btn" onclick="restartCurrentQuiz()"></button>
          <button class="btn-ghost" id="choose-btn" onclick="goHome()"></button>
        </div>
      </div>
    </div>
  </section>

  <script>
    const UI = {
      pl: {
        title: 'Quizy osobowości — Bookverse Quiz Hub',
        brand: 'Bookverse Quiz Hub',
        homeEyebrow: 'Quiz Hub · Bookverse',
        homeTitle: 'Wybierz quiz i sprawdź swój wynik',
        homeLead: 'Siedem światów, siedem różnych klimatów i osobne wyniki',
        start: 'Rozpocznij quiz',
        back: 'Wróć do wyboru',
        questionOf: 'Pytanie {current} z {total}',
        questionLabel: '{title} · Pytanie {current}',
        scoreTitle: 'Rozkład punktów',
        replay: 'Zagraj jeszcze raz',
        chooseAnother: 'Wybierz inny quiz',
        resultLabel: '{title} · Twój wynik',
        tieText: ' Twój wynik jest bardzo wyrównany, więc masz w sobie też wyraźny rys drugiej postaci.',
        resultText: ' To właśnie ta postać najmocniej wybrzmiała w Twoich odpowiedziach.',
        points: 'pkt',
        light: 'Light',
        dark: 'Dark'
      },
      en: {
        title: 'Personality Quizzes — Bookverse Quiz Hub',
        brand: 'Bookverse Quiz Hub',
        homeEyebrow: 'Quiz Hub · Bookverse',
        homeTitle: 'Choose a quiz and see your result',
        homeLead: 'Seven worlds, seven different moods, and separate results',
        start: 'Start quiz',
        back: 'Back to selection',
        questionOf: 'Question {current} of {total}',
        questionLabel: '{title} · Question {current}',
        scoreTitle: 'Score breakdown',
        replay: 'Play again',
        chooseAnother: 'Choose another quiz',
        resultLabel: '{title} · Your result',
        tieText: ' Your score is very close, so you also show a strong trace of the runner-up character.',
        resultText: ' This is the character that came through most strongly in your answers.',
        points: 'pts',
        light: 'Light',
        dark: 'Dark'
      }
    };

    const QUIZZES = {
      offcampus: {
        previewLimit: 4,
        pl: {
          badge: 'Quiz I',
          title: 'Off-Campus',
          subtitle: 'romans · college · emocje · relacje',
          intro: 'Odpowiedz na pytania o emocje, zaufanie, bliskość i ambicję. Wynik pokaże, która bohaterka Off-Campus najbardziej pasuje do Twojego temperamentu.',
          preview: ['Hannah', 'Grace', 'Sabrina', 'Allie'],
          characters: {

          badge: 'Quiz I', title: 'Off-Campus', subtitle: 'romance · college · emotions · relationships', intro: 'Answer questions about emotions, trust, closeness, and ambition. Your result will show which Off-Campus heroine best matches your temperament.', preview: ['Hannah', 'Grace', 'Sabrina', 'Allie'],
          characters: {
            hannah: { name: 'Hannah Wells', short: 'Hannah', image: './hannah.jpg', traits: ['Sensitive','Attentive','Intelligent','Authentic'], desc: 'You are closest to Hannah if you value calm, authenticity, and emotional depth. Before you open up, you need to feel safe and truly understood.', extra: 'Your strength is not noise but attentiveness. What matters most to you are relationships where you can be yourself without pressure.' },
            grace: { name: 'Grace Ivers', short: 'Grace', image: './grace.jpg', traits: ['Gentle','Empathetic','Steady','Warm'], desc: 'You are closest to Grace if you carry softness that does not mean weakness. You may take time to grow into your choices, but once you find yourself, you become deeply consistent.', extra: 'There is tenderness in the way you move through the world, but also resilience. You learn closeness slowly and deeply.' },
            sabrina: { name: 'Sabrina James', short: 'Sabrina', image: './sabrina.jpg', traits: ['Ambitious','Disciplined','Independent','Strong'], desc: 'You are closest to Sabrina if agency, purpose, and independence matter most to you. Even when you feel deeply, you do not reveal everything right away.', extra: 'You have a high threshold for pressure and do not like leaving your life to chance. Closeness matters to you only if it does not take away your autonomy.' },
            allie: { name: 'Allie Hayes', short: 'Allie', image: './allie.jpg', traits: ['Social','Warm','Lively','Loyal'], desc: 'You are closest to Allie if relationships, energy, and emotional honesty are at the center of your world. You read people well and bring warmth and closeness into their lives.', extra: 'You can be spontaneous, but beneath that lightness there is real attachment. When you love, you do it wholeheartedly.' }
          },
          questions: [
            { p:'When you face an important life decision, what matters most to you?', h:'Choose what feels most natural.', a:[

              { t:'Withdraw and need time.', s:'Trust comes back slowly for me.', pts:{ hannah:3, grace:1 } },

              { t:'Gentleness and understanding.', s:'I do not judge too quickly.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'In a new environment, you usually…', h:'This is about your real instinct, not the ideal version.', a:[
              { t:'Observe first.', s:'I prefer to get a feel for people.', pts:{ hannah:3, grace:1 } },
              { t:'Look for one safe person.', s:'I need a softer entry.', pts:{ grace:3, allie:1 } },
              { t:'Start connecting right away.', s:'I feel better in motion than in suspension.', pts:{ allie:3, hannah:1 } },

            ]},
            { p:'What do you most want to protect in your future?', h:'This question is about your core.', a:[

              { t:'Peace and gentleness toward myself.', s:'I want less fear and more breathing room.', pts:{ grace:3, hannah:1 } }

              { t:'Is patient while you learn to trust.', s:'Safety builds slowly in me.', pts:{ grace:3, hannah:1 } }
            ]},

              { t:'Relationships that bring warmth and community.', s:'For me, meaning grows through togetherness.', pts:{ allie:3, hannah:1 } },

            ]}

        en: {
          badge:'Quiz II', title:'Game of Thrones', subtitle:'power · survival · loyalty · strategy', intro:'This quiz focuses on power, survival, ambition, loyalty, and the way you act under pressure. Your result will show which iconic Game of Thrones character is closest to you.', preview:['Daenerys','Jon','Arya','Sansa','Tyrion','Cersei'],
          characters:{
            daenerys:{name:'Daenerys Targaryen',short:'Daenerys',image:'./daenerys.jpg',traits:['Charismatic','Fiery','Driven','Idealistic'],desc:'You are closest to Daenerys if you naturally gravitate toward leadership, change, and big visions. You can inspire people and find it hard to ignore injustice.',extra:'You carry both heart and strength. When you believe in something, you pursue it boldly and on a grand scale.'},
            jon:{name:'Jon Snow',short:'Jon',image:'./jon.jpg',traits:['Loyal','Honorable','Quiet','Responsible'],desc:'You are closest to Jon if, in crisis, you think first about duty and protecting others. You do not need noise around you to have authority.',extra:'People trust you because you are steady and honest. Even when you doubt yourself, you try to do what you believe is right.'},
            arya:{name:'Arya Stark',short:'Arya',image:'./arya.jpg',traits:['Independent','Rebellious','Brave','Unpredictable'],desc:'You are closest to Arya if you value freedom more than other people’s expectations. You are not afraid to follow your own path even when nobody understands it.',extra:'You have strong instincts and a lot of resilience. You work best when you can be fully yourself.'},
            sansa:{name:'Sansa Stark',short:'Sansa',image:'./sansa.jpg',traits:['Strategic','Composed','Resilient','Observant'],desc:'You are closest to Sansa if you learn about the world through observation, patience, and reading people. You can survive difficult things without losing your dignity.',extra:'Your strength does not need to be loud. Sometimes the greatest advantage is seeing further than others do.'},
            tyrion:{name:'Tyrion Lannister',short:'Tyrion',image:'./tyrion.jpg',traits:['Witty','Reflective','Cynical','Empathetic'],desc:'You are closest to Tyrion if you value intelligence, irony, and the ability to see the world from many angles. Even in chaos, you try to think clearly.',extra:'Your mind does not like simple answers. You can combine distance with real understanding of people.'},
            cersei:{name:'Cersei Lannister',short:'Cersei',image:'./cersei.jpg',traits:['Proud','Controlling','Strong','Political'],desc:'You are closest to Cersei if you do not surrender control easily and take loyalty to your inner circle very seriously. You know the world can be brutal, so you learned to be hard.',extra:'You have a strong survival instinct and tremendous willpower. You dislike helplessness and would rather act than wait for someone else to decide.'}
          },
          questions:[
            { p:'Power is, above all, for you…', h:'Choose the answer that feels most natural.', a:[
              { t:'A tool for changing the world.', s:'If I have influence, I want to use it for something meaningful.', pts:{ daenerys:3, jon:1 } },
              { t:'A responsibility that cannot be taken lightly.', s:'I think about consequences first.', pts:{ jon:3, sansa:1 } },
              { t:'Something not worth handing over to others.', s:'Without control, it is easy to be destroyed.', pts:{ cersei:3, sansa:1 } },

              { t:'I prove my worth through actions.', s:'I do not need empty declarations.', pts:{ jon:3, arya:1 } },
              { t:'I remember it and wait for the right moment.', s:'I am not impulsive, but I do not forget.', pts:{ sansa:3, cersei:1 } },
              { t:'I answer sharply and do not back down.', s:'I do not let myself be pushed aside.', pts:{ daenerys:3, cersei:1 } },
              { t:'I use irony or intelligence.', s:'Sometimes words are sharper than swords.', pts:{ tyrion:3, arya:1 } }
            ]},

              { t:'Loyalty.', s:'I do not abandon my people.', pts:{ jon:3, daenerys:1 } },
              { t:'Independence.', s:'I need my own path.', pts:{ arya:3, daenerys:1 } },
              { t:'The ability to read people.', s:'I see more than I show.', pts:{ sansa:3, tyrion:1 } },
              { t:'Strong will.', s:'When I decide something, I am hard to stop.', pts:{ cersei:3, daenerys:1 } }
            ]},
            { p:'In a crisis, you usually rely on…', h:'What appears first in you?', a:[
              { t:'Bold action.', s:'Sometimes you simply have to move forward.', pts:{ daenerys:3, arya:1 } },
              { t:'A sense of duty.', s:'First you do what is right.', pts:{ jon:3, sansa:1 } },
              { t:'Analysis and planning.', s:'Without a cool head, it is easy to lose.', pts:{ tyrion:3, sansa:1 } },
              { t:'Maintaining your advantage.', s:'In crisis, you cannot show weakness.', pts:{ cersei:3, tyrion:1 } }
            ]},
            { p:'What do you fear most?', h:'Choose the loss that hits you hardest.', a:[

              { t:'Losing control over my own fate.', s:'Without agency, I feel helpless.', pts:{ cersei:3, sansa:1 } },
              { t:'Losing reason in emotional chaos.', s:'I need to see the full picture.', pts:{ tyrion:3, sansa:1 } }

              { t:'I mainly help my own people.', s:'Loyalty has a circle for me.', pts:{ cersei:3, daenerys:1 } }
            ]},
            { p:'Your relationship with authority is that…', h:'Choose the option closest to you.', a:[

              { t:'I understand that authority also has to be built.', s:'It is more complex than simple obedience.', pts:{ sansa:3, tyrion:1 } },
              { t:'I would rather be the one deciding.', s:'I do not like depending on other people’s whims.', pts:{ cersei:3, daenerys:1 } }
            ]},
            { p:'You are most drawn to the vision of…', h:'Which future speaks to you most strongly?', a:[
              { t:'Great change.', s:'I want to leave a mark.', pts:{ daenerys:3, jon:1 } },
              { t:'A life aligned with honor.', s:'Honesty with myself gives me peace.', pts:{ jon:3, sansa:1 } },
              { t:'Complete independence.', s:'I want to choose my own path.', pts:{ arya:3, daenerys:1 } },
              { t:'A position from which nothing can push me away.', s:'Strength gives me safety.', pts:{ cersei:3, sansa:1 } }
            ]},
            { p:'In relationships, you value most…', h:'What is your foundation?', a:[

              { t:'Mutual respect and intelligence.', s:'Closeness without understanding does not satisfy me.', pts:{ tyrion:3, sansa:1 } },
              { t:'Loyalty to a shared goal.', s:'A relationship has to withstand reality.', pts:{ daenerys:3, jon:1 } }
            ]},
            { p:'When you begin a new chapter, what do you want most?', h:'What energy do you bring into the beginning?', a:[

              { t:'To do it properly.', s:'I would rather go slower but honestly.', pts:{ jon:3, sansa:1 } },
              { t:'To follow my own path.', s:'I do not want to be written into someone else’s plan.', pts:{ arya:3, jon:1 } },
              { t:'To read the field and position the pieces.', s:'First I want to understand the game board.', pts:{ tyrion:3, sansa:1 } }
            ]}
          ]

        en: {
          badge:'Quiz V', title:'Foundation', subtitle:'future · memory · crisis · empire', intro:'This quiz gives you two results at once. First, it shows which Foundation character you are closest to, then it reveals the role you would most likely play in that world.', preview:['Gaal','Hari','Day','Dawn','Dusk','Demerzel'],
          roleLabel:'Your role',
          roleLead:'In the world of Foundation, you are closest to this function:',
          characters:{
            gaal:{name:'Gaal Dornick',short:'Gaal',image:'./gaal.jpg',traits:['Intuitive','Perceptive','Sensitive','Independent'],desc:'You are closest to the series version of Gaal if you combine intellect with intuition and often sense the direction of things before you can name it.',extra:'You are not a figure of the center, and that is exactly why you see more. There is movement toward the future in you, even when there is not yet language for it.'},
            hari:{name:'Hari Seldon',short:'Hari',image:'./hari.jpg',traits:['Systemic','Far-sighted','Cool-headed','Creative'],desc:'You are closest to Hari if you think in terms of processes, structures, and long stretches of time. You can see a larger pattern where others only see chaos.',extra:'Your strength lies in designing what is meant to endure. You are not always the softest person in the room, but very often you are the one who understands the scale.'},
            day:{name:'Brother Day',short:'Day',image:'./day.jpg',traits:['Dominant','Charismatic','Political','Decisive'],desc:'You are closest to Brother Day if you naturally take up space, do not fear influence, and like acting from a position of power.',extra:'There is a certainty in you that can both attract and intimidate. Once you enter the game, you are hard to ignore.'},
            dawn:{name:'Brother Dawn',short:'Dawn',image:'./dawn.jpg',traits:['Sensitive','Ambiguous','Searching','Gentle'],desc:'You are closest to Brother Dawn if your strength is born from inner fracture, questions, and the need to find your own place.',extra:'You are not a figure of pure domination. You are more interested in transition, transformation, and who a person can become beyond an assigned role.'},
            dusk:{name:'Brother Dusk',short:'Dusk',image:'./dusk.jpg',traits:['Reflective','Remembering','Dignified','Conservative'],desc:'You are closest to Brother Dusk if memory, continuity, and awareness of what has been lost matter deeply to you.',extra:'There is distance and historical imagination in you. You often recognize the weight of things just when others want to rush onward.'},
            demerzel:{name:'Demerzel',short:'Demerzel',image:'./demerzel.jpg',traits:['Composed','Loyal','Complex','Patient'],desc:'You are closest to Demerzel if you can combine coolness with tenderness, duty with emotion, and survival with hidden depth.',extra:'You are the kind of person who holds the whole structure together even when you pay the highest personal cost. It is quiet strength, but nearly indestructible.'}
          },
          roles:{
            wzory:{name:'Reader of Patterns',short:'Reader of Patterns',traits:['Analysis','Intuition','Future'],desc:'You read the movement of the world like a hidden script. You may not always explain it right away, but you often sense the right direction.',extra:'Your role is to recognize what is only beginning to emerge.'},
            pamiec:{name:'Keeper of Memory',short:'Keeper of Memory',traits:['Continuity','Memory','Legacy'],desc:'You protect what should not disappear. In chaos, you are the person who remembers meaning, origin, and the cost of earlier choices.',extra:'Without people like you, history breaks into random fragments.'},
            przyszlosc:{name:'Architect of the Future',short:'Architect of the Future',traits:['Vision','Structure','Design'],desc:'You do not only predict — you build. You work best when you can shape a larger plan and guide events toward a long-range goal.',extra:'You think in layers, systems, and long horizons.'},
            kryzys:{name:'Mediator of Crisis',short:'Mediator of Crisis',traits:['Balance','Empathy','Tension'],desc:'In the hardest moments, you can calm movements that threaten to split everything apart. You connect people, languages, and positions.',extra:'You do not run from tension — you try to give it form.'},
            imperium:{name:'Imperial Strategist',short:'Imperial Strategist',traits:['Power','Decision','Influence'],desc:'You move best where the stakes are control, order, and the force of impact. You understand the mechanics of the center.',extra:'Your domain is decision, structure, and shaping the course of events.'},
            obrzeza:{name:'Voice of the Periphery',short:'Voice of the Periphery',traits:['Periphery','Difference','Truth'],desc:'You bring a perspective from outside the center, and that is why you can see what the heart of the system refuses to notice.',extra:'Your strength comes from a place treated as less important, but it often sees the world more clearly.'}
          },

          questions:[
            { p:'When you look at the future, what fascinates you most is that…', h:'Choose the answer closest to your instinct.', a:[
              { t:'it can be read like a hidden pattern.', s:'There is always a rhythm under the surface.', pts:{ gaal:3, hari:1 }, rolePts:{ wzory:3, przyszlosc:1 } },
              { t:'it can be deliberately designed.', s:'The most interesting thing is building what will last.', pts:{ hari:3, demerzel:1 }, rolePts:{ przyszlosc:3, imperium:1 } },
              { t:'it reveals who truly sets events in motion.', s:'I care about structures of power, not just decoration.', pts:{ day:3, dusk:1 }, rolePts:{ imperium:3, pamiec:1 } },
              { t:'it speaks most clearly through those the center ignores.', s:'The periphery often sees first.', pts:{ dawn:2, gaal:2 }, rolePts:{ obrzeza:3, kryzys:1 } }
            ]},
            { p:'When you find yourself at the center of a crisis, your first instinct is to…', h:'Think of your real reaction, not the ideal one.', a:[
              { t:'calm the chaos and find a point of balance.', s:'First, the collapse has to stop.', pts:{ demerzel:3, dawn:1 }, rolePts:{ kryzys:3, pamiec:1 } },
              { t:'take control and impose direction.', s:'Someone has to decide.', pts:{ day:3, hari:1 }, rolePts:{ imperium:3, przyszlosc:1 } },
              { t:'check which patterns explain it.', s:'I want to understand the structure beneath the chaos.', pts:{ hari:3, gaal:1 }, rolePts:{ wzory:2, przyszlosc:2 } },
              { t:'watch people, because crisis exposes memory and hidden motives.', s:'Tension reveals what truly matters.', pts:{ dusk:3, demerzel:1 }, rolePts:{ pamiec:3, kryzys:1 } }
            ]},
            { p:'What unsettles you most is a world in which…', h:'Choose the answer that genuinely moves you.', a:[
              { t:'power forgets why it exists.', s:'A system without meaning becomes empty.', pts:{ dusk:3, demerzel:1 }, rolePts:{ pamiec:3, imperium:1 } },
              { t:'people act without a larger plan.', s:'Chaos without structure costs too much.', pts:{ hari:3, day:1 }, rolePts:{ przyszlosc:3, imperium:1 } },
              { t:'quiet and distant people are completely ignored.', s:'The worst happens when the center stops listening.', pts:{ gaal:3, dawn:1 }, rolePts:{ obrzeza:3, kryzys:1 } },
              { t:'emotion is treated as an obstacle rather than a source of knowledge.', s:'Not everything can be read through reason alone.', pts:{ dawn:3, gaal:1 }, rolePts:{ kryzys:2, wzory:2 } }
            ]},
            { p:'Which sentence sounds most like you?', h:'Choose the one that feels closest to your core.', a:[
              { t:'I understand more than I can explain right away.', s:'Some things are felt before they are named.', pts:{ gaal:3, dawn:1 }, rolePts:{ wzory:3, obrzeza:1 } },
              { t:'What matters most is what will outlast generations.', s:'I think in long duration, not just in moments.', pts:{ hari:3, dusk:1 }, rolePts:{ przyszlosc:2, pamiec:2 } },
              { t:'Order sometimes has to be maintained with a firm hand.', s:'Not everything can be saved with softness.', pts:{ day:3, demerzel:1 }, rolePts:{ imperium:3, kryzys:1 } },
              { t:'Real change begins outside the center.', s:'The strongest energy often comes from the edges.', pts:{ dawn:2, gaal:2 }, rolePts:{ obrzeza:3, wzory:1 } }
            ]},
            { p:'If you can influence events, you want above all to…', h:'Think about what gives you the deepest sense of purpose.', a:[
              { t:'reduce the scale of future catastrophe.', s:'Not everything can be saved, but loss can be limited.', pts:{ hari:3, demerzel:1 }, rolePts:{ przyszlosc:3, kryzys:1 } },
              { t:'protect the continuity of the system.', s:'Collapse costs more than it first appears.', pts:{ dusk:2, demerzel:2 }, rolePts:{ pamiec:3, imperium:1 } },
              { t:'hear what others do not want to hear.', s:'The margins often carry the deepest truth.', pts:{ gaal:3, dawn:1 }, rolePts:{ obrzeza:3, kryzys:1 } },
              { t:'connect opposing sides before everything breaks.', s:'In tension, bridges matter most.', pts:{ demerzel:3, dawn:1 }, rolePts:{ kryzys:3, pamiec:1 } }
            ]},
            { p:'Your greatest strength is usually…', h:'Choose the trait you truly recognize in yourself.', a:[
              { t:'intuition joined with abstract thinking.', s:'I see relations before they become obvious.', pts:{ gaal:3, hari:1 }, rolePts:{ wzory:3, przyszlosc:1 } },
              { t:'patience and long historical vision.', s:'Not everything has to be resolved immediately.', pts:{ dusk:3, demerzel:1 }, rolePts:{ pamiec:3, kryzys:1 } },
              { t:'a natural ability to manage people and space.', s:'I like things to have direction.', pts:{ day:3, hari:1 }, rolePts:{ imperium:3, przyszlosc:1 } },
              { t:'reading tensions before they turn into conflict.', s:'I can feel when something is beginning to fracture.', pts:{ demerzel:3, dawn:1 }, rolePts:{ kryzys:3, obrzeza:1 } }
            ]},
            { p:'In relation to knowledge, you are more the kind of person who…', h:'Choose the answer closest to your style of thinking.', a:[
              { t:'looks for the hidden model beneath the surface.', s:'I care about what organizes chaos.', pts:{ hari:2, gaal:2 }, rolePts:{ wzory:3, przyszlosc:1 } },
              { t:'treats knowledge as a tool of power and decision.', s:'What I know should lead to influence.', pts:{ day:3, dusk:1 }, rolePts:{ imperium:3, pamiec:1 } },
              { t:'sees knowledge as a form of civilizational memory.', s:'The past is not dead, only active.', pts:{ dusk:3, demerzel:1 }, rolePts:{ pamiec:3, wzory:1 } },
              { t:'believes knowledge without empathy leads to blindness.', s:'I do not want to understand the world at the expense of people.', pts:{ dawn:2, demerzel:2 }, rolePts:{ kryzys:3, obrzeza:1 } }
            ]},
            { p:'You are most drawn to the role of someone who…', h:'Choose the most tempting vision.', a:[
              { t:'understands processes before others do.', s:'The greatest advantage is seeing direction early.', pts:{ gaal:3, hari:1 }, rolePts:{ wzory:3, przyszlosc:1 } },
              { t:'guards what is meant to endure.', s:'Not everything new is better than continuity.', pts:{ demerzel:2, dusk:2 }, rolePts:{ pamiec:3, imperium:1 } },
              { t:'speaks from a place considered less important.', s:'What is pushed aside can be the most accurate.', pts:{ dawn:2, gaal:2 }, rolePts:{ obrzeza:3, kryzys:1 } },
              { t:'keeps the whole system moving despite conflicting interests.', s:'What fascinates me most is holding everything together.', pts:{ demerzel:3, day:1 }, rolePts:{ kryzys:2, imperium:2 } }
            ]},
            { p:'When someone questions your authority, you most often…', h:'Think of your first instinct.', a:[
              { t:'respond with calm and precision.', s:'I do not need noise to be right.', pts:{ hari:3, dusk:1 }, rolePts:{ przyszlosc:2, pamiec:2 } },
              { t:'show that control still belongs to you.', s:'I do not let my boundaries shift easily.', pts:{ day:3, demerzel:1 }, rolePts:{ imperium:3, kryzys:1 } },
              { t:'withdraw outwardly, but remember everything.', s:'Sometimes memory and observation are the strongest force.', pts:{ dusk:3, demerzel:1 }, rolePts:{ pamiec:3, obrzeza:1 } },
              { t:'try to understand what truly creates the resistance.', s:'Conflict often hides something deeper.', pts:{ dawn:2, gaal:2 }, rolePts:{ kryzys:3, wzory:1 } }
            ]},
            { p:'You feel closest to a vision of the world in which…', h:'Choose the one that sounds most true to you.', a:[
              { t:'the future can be read, but never fully controlled.', s:'Patterns exist, but they are never absolute.', pts:{ gaal:3, hari:1 }, rolePts:{ wzory:3, przyszlosc:1 } },
              { t:'memory matters as much as action.', s:'Without continuity, even great movements lose meaning.', pts:{ dusk:3, demerzel:1 }, rolePts:{ pamiec:3, kryzys:1 } },
              { t:'crisis is not an ending but a point of transition.', s:'The most important things are born in fracture.', pts:{ dawn:3, gaal:1 }, rolePts:{ kryzys:3, obrzeza:1 } },
              { t:'the center is not always right, even when it has power.', s:'What is official is not always what is true.', pts:{ gaal:2, dawn:2 }, rolePts:{ obrzeza:3, imperium:1 } }
            ]}
          ]
        }
      },

          characters:{
            leia:{name:'Leia Organa',short:'Leia',image:'./leia.jpg',traits:['Przywódcza','Twarda','Lojalna','Bystra'],desc:'Najbliżej Ci do Lei, jeśli naturalnie bierzesz odpowiedzialność, umiesz łączyć serce z politycznym instynktem i nie uciekasz od trudnych decyzji.',extra:'Masz w sobie ogień, ale nie jest to ogień chaosu. To energia osoby, która potrafi prowadzić innych przez napięcie.'},
            padme:{name:'Padmé Amidala',short:'Padmé',image:'./padme.jpg',traits:['Dyplomatyczna','Godna','Empatyczna','Stanowcza'],desc:'Najbliżej Ci do Padmé, jeśli cenisz godność, dialog i działanie z myślą o większym dobru.',extra:'W Twojej sile jest elegancja i konsekwencja. Wiesz, że stanowczość nie musi oznaczać brutalności.'},

              <h3 class="universe-title">${quiz.title}</h3>
              <p class="universe-subtitle">${quiz.subtitle}</p>
            </div>
            <div class="chip-row">${quiz.preview.map(item => `<span class="chip">${item}</span>`).join('')}</div>
          </div>
        `;
      }).join('');
    }

    function goTo(stepId){
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function handleMissingImage(img){
      const portrait = img.closest('.portrait');
      if(portrait){ portrait.classList.add('missing'); }
      img.style.display = 'none';
    }

    function renderIntro(){
      const activeQuiz = getActiveQuiz();
      if(!activeQuiz) return;
      introBadge.textContent = activeQuiz.badge;
      introTitle.textContent = activeQuiz.title;
      introLead.textContent = activeQuiz.intro;
      const previewChars = Object.values(activeQuiz.characters).slice(0, 4);
      introCharacters.innerHTML = previewChars.map(char => `
        <div class="character-card">
          <div class="portrait" data-label="${safeLabel(char.name)}">
            <img src="${char.image}" alt="${char.name}" onerror="handleMissingImage(this)">
          </div>
          <div class="character-name">${safeLabel(char.name)}</div>
        </div>
      `).join('');
    }

    function openIntro(quizKey){
      activeQuizKey = quizKey;
      setUniverseTheme(quizKey);
      renderIntro();
      goTo('step-intro');
    }

    let roleScores = {};

    function resetScores(){
      scores = {};
      roleScores = {};
      const activeQuiz = getActiveQuiz();
      Object.keys(activeQuiz.characters).forEach(key => scores[key] = 0);
      if(activeQuiz.roles){
        Object.keys(activeQuiz.roles).forEach(key => roleScores[key] = 0);
      }
    }

    function startQuiz(){
      currentQuestion = 0;
      resetScores();
      renderQuestion();
      goTo('step-quiz');
    }

    function renderQuestion(){
      const activeQuiz = getActiveQuiz();
      const q = activeQuiz.questions[currentQuestion];
      const total = activeQuiz.questions.length;
      const pct = Math.round((currentQuestion / total) * 100);

      document.getElementById('q-counter').textContent = t('questionOf', { current: currentQuestion + 1, total });
      document.getElementById('q-pct').textContent = `${pct}%`;
      document.getElementById('progress-fill').style.width = `${pct}%`;

      document.getElementById('question-area').innerHTML = `
        <div class="q-label">${t('questionLabel', { title: activeQuiz.title, current: currentQuestion + 1 })}</div>
        <div class="q-title">${q.p}</div>
        <p class="q-hint">${q.h}</p>
        <div class="answers">
          ${q.a.map((answer, i) => `
            <button class="answer" onclick="pickAnswer(${i})">
              ${answer.t}
              <span>${answer.s}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function pickAnswer(index){
      const activeQuiz = getActiveQuiz();
      const answer = activeQuiz.questions[currentQuestion].a[index];
      Object.entries(answer.pts).forEach(([key, val]) => { scores[key] += val; });
      currentQuestion += 1;
      if(currentQuestion < activeQuiz.questions.length){ renderQuestion(); }
      else { showResult(); }
    }

    function showResult(){
      const activeQuiz = getActiveQuiz();
      const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
      const [winnerKey, winnerScore] = sorted[0];
      const winner = activeQuiz.characters[winnerKey];
      const tie = sorted[1] && sorted[1][1] === winnerScore;

      document.getElementById('result-badge').textContent = t('resultLabel', { title: activeQuiz.title });
      document.getElementById('result-name').textContent = winner.name;
      document.getElementById('result-desc').textContent = winner.desc;
      document.getElementById('result-extra').textContent = winner.extra + (tie ? t('tieText') : t('resultText'));
      document.getElementById('result-traits').innerHTML = winner.traits.map(trait => `<span class="trait">${trait}</span>`).join('');

      const portrait = document.getElementById('result-portrait');
      const resultImg = document.getElementById('result-img');
      portrait.classList.remove('missing');
      portrait.setAttribute('data-label', safeLabel(winner.name));
      resultImg.style.display = 'block';
      resultImg.src = winner.image;
      resultImg.alt = winner.name;

      const roleBox = document.getElementById('role-box');
      if(activeQuiz.roles && Object.keys(roleScores).length){
        const sortedRoles = Object.entries(roleScores).sort((a,b) => b[1] - a[1]);
        const roleWinner = activeQuiz.roles[sortedRoles[0][0]];
        roleBox.style.display = "block";
        document.getElementById('role-title').textContent = activeQuiz.roleLabel || "Your role";
        document.getElementById('role-name').textContent = roleWinner.name;
        document.getElementById('role-lead').textContent = activeQuiz.roleLead || "";
        document.getElementById('role-desc').textContent = roleWinner.desc;
        document.getElementById('role-traits').innerHTML = roleWinner.traits.map(trait => `<span class="trait">${trait}</span>`).join("");
        document.getElementById('role-extra').textContent = roleWinner.extra;
      } else {
        roleBox.style.display = "none";
      }

      const maxScore = Math.max(...Object.values(scores), 1);
      document.getElementById('score-list').innerHTML = sorted.map(([key, val]) => {
        const width = Math.max(8, (val / maxScore) * 100);
        return `
          <div class="score-item">
            <div class="score-head"><strong>${activeQuiz.characters[key].short}</strong><span>${val} ${t('points')}</span></div>
            <div class="score-track"><div class="score-fill" style="width:${width}%"></div></div>
          </div>
        `;
      }).join('');

      goTo('step-result');
    }

    function restartCurrentQuiz(){ if(activeQuizKey) startQuiz(); }
    function goHome(){ activeQuizKey = null; setUniverseTheme('home'); goTo('step-home'); }

    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');
    setLanguage('pl');
    setUniverseTheme('home');
  </script>
</body>
</html>
