<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizy osobowości — Off-Campus, Gra o tron, Ród smoka i Rycerz Siedmiu Królestw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f9fc;
      --card:#ffffff;
      --line:#d6e4ee;
      --text:#102131;
      --muted:#526475;
      --accent:#1b6a96;
      --accent-dark:#124f70;
      --accent-soft:#deedf6;
      --shadow:0 20px 48px rgba(12,32,48,.09);
      --pill:999px;
      --radius:28px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding:24px 12px 56px;
    }
    h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;line-height:1.08}
    img{display:block;max-width:100%}
    button{font:inherit;cursor:pointer}

    .step{display:none;width:min(1080px,100%);margin:0 auto;animation:fadeIn .24s ease}
    .step.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .home-body{padding:46px 42px 38px}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      padding:8px 14px;
      border-radius:var(--pill);
      background:var(--accent-soft);
      color:var(--accent);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.14em;
      margin-bottom:18px;
    }
    .home-title{font-size:clamp(2.5rem,5vw,4.3rem);max-width:13ch;margin-bottom:14px}
    .home-lead{color:var(--muted);max-width:66ch;font-size:1.05rem;line-height:1.6;margin-bottom:28px}

    .universe-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }
    .universe-card{
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px 20px;
      background:linear-gradient(180deg,#fff 0%,#f9fcff 100%);
      transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
      cursor:pointer;
      min-height:220px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .universe-card:hover{
      transform:translateY(-4px);
      border-color:var(--accent);
      box-shadow:0 18px 40px rgba(12,32,48,.12);
    }
    .universe-badge{
      display:inline-flex;
      width:max-content;
      padding:7px 12px;
      border-radius:var(--pill);
      background:var(--accent-soft);
      color:var(--accent);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:14px;
    }
    .universe-title{font-size:1.8rem;margin-bottom:10px}
    .universe-subtitle{color:var(--muted);line-height:1.55;font-size:.97rem;margin-bottom:18px}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      padding:8px 12px;
      border-radius:var(--pill);
      border:1px solid var(--line);
      background:#f3f8fb;
      font-size:13px;
      font-weight:700;
      color:var(--text);
    }

    .intro-grid{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:0;
      align-items:stretch;
    }
    .intro-main{padding:42px 40px 34px}
    .intro-side{
      background:linear-gradient(180deg,#f8fbfe 0%,#eef5fa 100%);
      border-left:1px solid var(--line);
      padding:30px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .intro-title{font-size:clamp(2.1rem,4vw,3.4rem);margin-bottom:12px;max-width:14ch}
    .intro-lead{color:var(--muted);line-height:1.65;max-width:54ch;margin-bottom:28px}
    .intro-actions{display:flex;flex-wrap:wrap;gap:12px}

    .btn-primary,
    .btn-secondary,
    .btn-ghost{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:var(--pill);
      padding:16px 28px;
      font-weight:800;
      border:none;
      transition:transform .14s ease,background .14s ease,border-color .14s ease,color .14s ease;
    }
    .btn-primary{background:var(--accent);color:#fff;box-shadow:0 12px 28px rgba(27,106,150,.22)}
    .btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px)}
    .btn-secondary{background:#fff;color:var(--text);border:1.5px solid var(--line)}
    .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
    .btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

    .character-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .character-card{display:grid;gap:8px}
    .portrait{
      aspect-ratio:3/4;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--line);
      background:#eaf2f8;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .portrait img{width:100%;height:100%;object-fit:cover}
    .portrait.missing::after{
      content:attr(data-label);
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:12px;
      color:#5e7182;
      font-weight:800;
      font-size:1rem;
      letter-spacing:.02em;
      background:linear-gradient(180deg,#edf4f9 0%,#e2edf5 100%);
    }
    .character-name{text-align:center;font-size:13px;font-weight:700;color:var(--muted)}

    .quiz-body{padding:40px 42px 34px}
    .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--muted)}
    .progress-track{height:8px;background:#d8e8f0;border-radius:var(--pill);overflow:hidden;margin-bottom:30px}
    .progress-fill{height:100%;background:linear-gradient(90deg,#9ecee8,var(--accent));border-radius:inherit;transition:width .24s ease}
    .q-label{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;margin-bottom:12px}
    .q-title{font-size:clamp(1.45rem,2.4vw,2rem);font-weight:800;line-height:1.26;margin-bottom:10px}
    .q-hint{color:var(--muted);font-size:.96rem;margin-bottom:26px}
    .answers{display:grid;gap:10px}
    .answer{
      width:100%;
      text-align:left;
      background:#fff;
      border:1.5px solid #c7d9e6;
      border-radius:18px;
      padding:18px 18px 16px;
      font-weight:700;
      color:var(--text);
      transition:border-color .14s ease,box-shadow .14s ease,transform .14s ease;
    }
    .answer:hover,.answer:focus-visible{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 8px 24px rgba(12,32,48,.08);
      transform:translateY(-1px);
    }
    .answer span{display:block;margin-top:5px;font-size:13.5px;font-weight:500;color:var(--muted)}

    .result-grid{display:grid;grid-template-columns:300px 1fr}
    .result-media{background:#edf4f8;min-height:100%}
    .result-media .portrait{height:100%;min-height:100%;border:none;border-radius:0;aspect-ratio:auto}
    .result-body{padding:40px 40px 34px}
    .result-name{font-size:clamp(2.1rem,3vw,3.1rem);margin-bottom:12px}
    .result-desc,.result-extra{color:var(--muted);line-height:1.68}
    .result-desc{margin-bottom:14px}
    .result-extra{margin-bottom:20px;font-size:.97rem}
    .traits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
    .trait{padding:9px 13px;border-radius:var(--pill);border:1px solid var(--line);background:#f1f6fa;font-size:13px;font-weight:700}
    .score-list{display:grid;gap:12px;margin-top:10px}
    .score-item{display:grid;gap:6px}
    .score-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
    .score-track{height:8px;background:#d8e8f0;border-radius:var(--pill);overflow:hidden}
    .score-fill{height:100%;background:linear-gradient(90deg,#9ecee8,var(--accent));border-radius:inherit}
    .result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}

    @media(max-width:980px){
      .universe-grid{grid-template-columns:1fr}
      .intro-grid,.result-grid{grid-template-columns:1fr}
      .intro-side{border-left:none;border-top:1px solid var(--line)}
    }
    @media(max-width:680px){
      .home-body,.intro-main,.quiz-body,.result-body{padding:28px 20px 24px}
      .intro-side{padding:22px 20px}
      .character-grid{grid-template-columns:repeat(2,1fr)}
      .result-media .portrait{aspect-ratio:4/3}
    }
  </style>
</head>
<body>
  <section class="step active" id="step-home">
    <div class="card">
      <div class="home-body">
        <div class="eyebrow">Quiz Hub · Bookverse</div>
        <h1 class="home-title">Wybierz uniwersum i sprawdź, która postać najbardziej do Ciebie pasuje</h1>
        <div class="universe-grid" id="universe-grid"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-intro">
    <div class="card intro-grid">
      <div class="intro-main">
        <div class="eyebrow" id="intro-badge">Quiz</div>
        <h2 class="intro-title" id="intro-title"></h2>
        <p class="intro-lead" id="intro-lead"></p>
        <div class="intro-actions">
          <button class="btn-primary" onclick="startQuiz()">Rozpocznij quiz</button>
          <button class="btn-secondary" onclick="goHome()">Wróć do wyboru</button>
        </div>
      </div>
      <div class="intro-side">
        <div class="character-grid" id="intro-characters"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-quiz">
    <div class="card">
      <div class="quiz-body">
        <div class="progress-row">
          <span id="q-counter">Pytanie 1 z 10</span>
          <span id="q-pct">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div id="question-area"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-result">
    <div class="card result-grid">
      <div class="result-media">
        <div class="portrait" id="result-portrait" data-label="Wynik">
          <img id="result-img" src="" alt="Wynik quizu" onerror="handleMissingImage(this)">
        </div>
      </div>
      <div class="result-body">
        <div class="eyebrow" id="result-badge">Twój wynik</div>
        <h2 class="result-name" id="result-name"></h2>
        <p class="result-desc" id="result-desc"></p>
        <div class="traits" id="result-traits"></div>
        <p class="result-extra" id="result-extra"></p>
        <div>
          <h3>Rozkład punktów</h3>
          <div class="score-list" id="score-list"></div>
        </div>
        <div class="result-actions">
          <button class="btn-primary" onclick="restartCurrentQuiz()">Zagraj jeszcze raz</button>
          <button class="btn-ghost" onclick="goHome()">Wybierz inny quiz</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    const QUIZZES = {
      offcampus: {
        key: 'offcampus',
        badge: 'Quiz I',
        title: 'Off-Campus',
        subtitle: 'romans · college · emocje · relacje',
        intro: 'Odpowiedz na pytania o emocje, zaufanie, bliskość i ambicję. Wynik pokaże, która bohaterka Off-Campus najbardziej pasuje do Twojego temperamentu.',
        preview: ['Hannah', 'Grace', 'Sabrina', 'Allie'],
        characters: {
          hannah: { name: 'Hannah Wells', short: 'Hannah', image: './hannah.jpg', traits: ['Wrażliwa','Uważna','Inteligentna','Autentyczna'], desc: 'Najbliżej Ci do Hannah, jeśli cenisz spokój, autentyczność i emocjonalną głębię. Zanim się otworzysz, chcesz czuć bezpieczeństwo i prawdziwe zrozumienie.', extra: 'Twoją siłą nie jest hałas, tylko uważność. Najwięcej znaczą dla Ciebie relacje, w których możesz być sobą bez gry i bez presji.' },
          grace: { name: 'Grace Ivers', short: 'Grace', image: './grace.jpg', traits: ['Delikatna','Empatyczna','Wytrwała','Ciepła'], desc: 'Najbliżej Ci do Grace, jeśli masz w sobie łagodność, która nie oznacza braku siły. Potrafisz długo dojrzewać do decyzji, lecz gdy odnajdziesz siebie, jesteś bardzo konsekwentna.', extra: 'W Twoim sposobie bycia jest dużo miękkości, ale też odporności. Uczysz się relacji powoli, za to bardzo głęboko.' },
          sabrina: { name: 'Sabrina James', short: 'Sabrina', image: './sabrina.jpg', traits: ['Ambitna','Zdyscyplinowana','Niezależna','Silna'], desc: 'Najbliżej Ci do Sabriny, jeśli najważniejsze są dla Ciebie sprawczość, cel i niezależność. Nawet gdy czujesz dużo, nie pokazujesz wszystkiego od razu.', extra: 'Masz wysoki próg wytrzymałości i nie lubisz oddawać swojego życia przypadkowi. Bliskość jest dla Ciebie ważna, ale tylko wtedy, gdy nie odbiera Ci podmiotowości.' },
          allie: { name: 'Allie Hayes', short: 'Allie', image: './allie.jpg', traits: ['Towarzyska','Serdeczna','Żywiołowa','Lojalna'], desc: 'Najbliżej Ci do Allie, jeśli relacje, energia i emocjonalna szczerość są w centrum Twojego świata. Dobrze czujesz ludzi i wnosisz do ich życia ciepło i bliskość.', extra: 'Potrafisz być spontaniczna, ale za tą lekkością stoi prawdziwe przywiązanie. Gdy kochasz, robisz to całym sercem.' }
        },
        questions: [
          { p:'Gdy stajesz przed ważną decyzją życiową, co jest dla Ciebie najważniejsze?', h:'Wybierz to, co brzmi najbardziej naturalnie.', a:[
            { t:'Bezpieczeństwo i niezależność.', s:'Muszę wiedzieć, że ten wybór mnie wzmacnia.', pts:{ sabrina:3, hannah:1 } },
            { t:'Wierność sobie i swoim wartościom.', s:'Nie chcę wygrywać czegoś kosztem siebie.', pts:{ hannah:3, grace:1 } },
            { t:'Wpływ decyzji na relacje z bliskimi.', s:'Nie oddzielam wyborów od ludzi.', pts:{ allie:3, grace:1 } },
            { t:'To, czy wybieram odważnie, a nie ze strachu.', s:'Chcę czuć, że naprawdę idę do przodu.', pts:{ grace:3, hannah:1 } }
          ]},
          { p:'Kiedy ktoś Cię rani, najczęściej…', h:'Pomyśl o swoim pierwszym odruchu.', a:[
            { t:'Wycofuję się i potrzebuję czasu.', s:'Zaufanie odbudowuję powoli.', pts:{ hannah:3, grace:1 } },
            { t:'Rozmawiam od razu.', s:'Wolę wyjaśnić niż dusić emocje.', pts:{ allie:3, hannah:1 } },
            { t:'Analizuję, czy ta relacja w ogóle jest dla mnie dobra.', s:'Nie chcę inwestować w coś, co mnie osłabia.', pts:{ sabrina:3, hannah:1 } },
            { t:'Próbuję zrozumieć, ale długo to noszę w sobie.', s:'Empatia nie wyklucza bólu.', pts:{ grace:3, allie:1 } }
          ]},
          { p:'Twoją największą siłą w relacjach jest…', h:'Wybierz cechę, którą w sobie najbardziej rozpoznajesz.', a:[
            { t:'Uważność i szczerość.', s:'Ludzie czują, że naprawdę ich słucham.', pts:{ hannah:3, grace:1 } },
            { t:'Ciepło i obecność.', s:'Wnoszę energię i bliskość.', pts:{ allie:3, hannah:1 } },
            { t:'Stabilność i samodzielność.', s:'Nie gubię siebie nawet w silnych emocjach.', pts:{ sabrina:3, grace:1 } },
            { t:'Łagodność i wyrozumiałość.', s:'Nie oceniam pochopnie.', pts:{ grace:3, hannah:1 } }
          ]},
          { p:'W nowym środowisku zwykle…', h:'Nie chodzi o ideał, tylko o prawdziwy odruch.', a:[
            { t:'Najpierw obserwuję.', s:'Wolę najpierw wyczuć ludzi.', pts:{ hannah:3, grace:1 } },
            { t:'Szukam jednej bezpiecznej osoby.', s:'Potrzebuję miękkiego wejścia.', pts:{ grace:3, allie:1 } },
            { t:'Od razu nawiązuję kontakt.', s:'Lepiej czuję się w ruchu niż w zawieszeniu.', pts:{ allie:3, hannah:1 } },
            { t:'Skupiam się na celu i zadaniu.', s:'Nie potrzebuję aprobaty, żeby działać.', pts:{ sabrina:3, hannah:1 } }
          ]},
          { p:'Najtrudniejsze w bliskości jest dla Ciebie…', h:'Wybierz odpowiedź, która najmocniej Cię dotyka.', a:[
            { t:'Zaufanie bez gwarancji, że nie zostanę zraniona.', s:'Bezpieczeństwo jest dla mnie kluczowe.', pts:{ hannah:3, grace:1 } },
            { t:'Oddanie komuś kontroli nad tym, co czuję.', s:'Nie lubię odsłaniać słabości za szybko.', pts:{ sabrina:3, hannah:1 } },
            { t:'To, że czuję wszystko bardzo intensywnie.', s:'Moje emocje bywają ogromne.', pts:{ allie:3, grace:1 } },
            { t:'Uwierzenie, że naprawdę zasługuję na miłość.', s:'Bliskość uruchamia we mnie także lęk.', pts:{ grace:3, hannah:1 } }
          ]},
          { p:'Kiedy jesteś przeciążona, zwykle…', h:'Pomyśl, co robisz najpierw.', a:[
            { t:'Próbuję jeszcze mocniej wszystko ogarnąć.', s:'Kontrola daje mi poczucie bezpieczeństwa.', pts:{ sabrina:3, grace:1 } },
            { t:'Szukam ciszy i przestrzeni.', s:'Muszę wrócić do siebie.', pts:{ hannah:3, grace:1 } },
            { t:'Idę do bliskiej osoby.', s:'Rozmowa pomaga mi odzyskać równowagę.', pts:{ allie:3, hannah:1 } },
            { t:'Najpierw to przeczekuję, potem się otwieram.', s:'Nie pokazuję wszystkiego od razu.', pts:{ grace:3, hannah:1 } }
          ]},
          { p:'Co najbardziej chcesz chronić w swojej przyszłości?', h:'To pytanie o Twój rdzeń.', a:[
            { t:'Niezależność.', s:'Nie chcę być od nikogo życiowo zależna.', pts:{ sabrina:3, hannah:1 } },
            { t:'Wrażliwość i uczciwość wobec siebie.', s:'Nie chcę twardnieć na siłę.', pts:{ hannah:3, grace:1 } },
            { t:'Zdolność kochania ludzi otwarcie.', s:'Nie chcę zamknąć serca.', pts:{ allie:3, grace:1 } },
            { t:'Spokój i łagodność wobec siebie.', s:'Chcę mniej lęku, więcej oddechu.', pts:{ grace:3, hannah:1 } }
          ]},
          { p:'Kiedy masz rację, ale jej wypowiedzenie może zranić kogoś bliskiego…', h:'Jak reagujesz najczęściej?', a:[
            { t:'Mówię wprost.', s:'Prawda jest ważniejsza niż pozorny spokój.', pts:{ sabrina:3, allie:1 } },
            { t:'Szukam delikatnego sposobu.', s:'Chcę być uczciwa, ale nie okrutna.', pts:{ hannah:3, grace:1 } },
            { t:'Najpierw myślę o konsekwencjach dla relacji.', s:'Liczy się dla mnie nie tylko co, ale też jak.', pts:{ allie:3, hannah:1 } },
            { t:'Długo układam to w sobie.', s:'Konflikt kosztuje mnie więcej, niż pokazuję.', pts:{ grace:3, hannah:1 } }
          ]},
          { p:'Najbardziej porusza Cię, gdy ktoś…', h:'Wybierz odpowiedź najbardziej „Twoją”.', a:[
            { t:'Naprawdę widzi Twoje wnętrze.', s:'Bycie rozumianą jest dla mnie bezcenne.', pts:{ hannah:3, grace:1 } },
            { t:'Wspiera Cię bez odbierania sprawczości.', s:'Pomoc ma wzmacniać, nie przejmować sterów.', pts:{ sabrina:3, grace:1 } },
            { t:'Daje ciepło i codzienną obecność.', s:'Miłość lubię czuć w prostych rzeczach.', pts:{ allie:3, hannah:1 } },
            { t:'Jest cierpliwy, gdy uczysz się ufać.', s:'Bezpieczeństwo buduje się we mnie powoli.', pts:{ grace:3, hannah:1 } }
          ]},
          { p:'Nowy etap życia chciałabyś zacząć od…', h:'Wybierz najbardziej kuszącą wizję.', a:[
            { t:'Pełnej sprawczości.', s:'Chcę sama ustalać warunki swojego życia.', pts:{ sabrina:3, grace:1 } },
            { t:'Autentyczności.', s:'Chcę żyć bez ukrywania siebie.', pts:{ hannah:3, grace:1 } },
            { t:'Relacji, które dają ciepło i wspólnotę.', s:'Sens rodzi się dla mnie we współobecności.', pts:{ allie:3, hannah:1 } },
            { t:'Odzyskanego spokoju.', s:'Chcę budować życie bez ciągłego napięcia.', pts:{ grace:3, hannah:1 } }
          ]}
        ]
      },

      got: {
        key: 'got',
        badge: 'Quiz II',
        title: 'Gra o tron',

        questions: [
          { p:'Co robi na Tobie największe wrażenie w drugim człowieku?', h:'Wybierz odpowiedź, która najbardziej do Ciebie pasuje.', a:[

            { t:'Wchodzę z energią i rozmową.', s:'Lubię od razu czuć atmosferę.', pts:{ lyonel:3, dunk:1 } }
          ]},
          { p:'Najtrudniej jest Ci zaakceptować…', h:'Która rzecz najmocniej Cię uwiera?', a:[
            { t:'Niesprawiedliwość wobec słabszych.', s:'To uruchamia mnie natychmiast.', pts:{ dunk:3, baelor:1 } },
            { t:'Bycie lekceważoną.', s:'Nie lubię, gdy ktoś uznaje mnie za mniej ważną.', pts:{ egg:3, maekar:1 } },
            { t:'Chaos i brak zasad.', s:'Potrzebuję porządku, żeby działać.', pts:{ maekar:3, baelor:1 } },
            { t:'Nudę i brak intensywności.', s:'Lubię, gdy coś się dzieje.', pts:{ lyonel:3, daeron:1 } }
          ]},
          { p:'Twoja największa siła to…', h:'Wybierz to, co najbardziej rozpoznajesz w sobie.', a:[
            { t:'Przyzwoitość.', s:'Nawet jeśli popełniam błędy, chcę być fair.', pts:{ dunk:3, baelor:1 } },
            { t:'Spryt i szybkie myślenie.', s:'Umiem znaleźć drogę nawet w trudnej sytuacji.', pts:{ egg:3, daeron:1 } },
            { t:'Powaga i odpowiedzialność.', s:'Ludzie wiedzą, że traktuję sprawy serio.', pts:{ maekar:3, baelor:1 } },
            { t:'Magnetyzm i pewność siebie.', s:'Potrafię porwać atmosferę za sobą.', pts:{ lyonel:3, dunk:1 } }
          ]},
          { p:'Jak reagujesz pod presją?', h:'Wybierz odpowiedź najbliższą prawdzie.', a:[
            { t:'Robię to, co wydaje się słuszne, nawet jeśli nieidealne.', s:'Nie zawsze wiem wszystko, ale działam sercem.', pts:{ dunk:3, egg:1 } },
            { t:'Myślę szybko i kombinuję.', s:'Lubię znajdować wyjście z sytuacji.', pts:{ egg:3, daeron:1 } },
            { t:'Usztywniam się i pilnuję dyscypliny.', s:'Kontrola daje mi bezpieczeństwo.', pts:{ maekar:3, baelor:1 } },
            { t:'Idę w energię i odwagę.', s:'Lepiej wejść w to mocno niż się wahać.', pts:{ lyonel:3, dunk:1 } }
          ]},
          { p:'Jaką rolę najczęściej pełnisz w grupie?', h:'Pomyśl, jak widzą Cię inni.', a:[
            { t:'Osoby, na której można polegać.', s:'Może nie błyszczę, ale jestem solidna.', pts:{ dunk:3, baelor:1 } },
            { t:'Tej, która wszystko zauważa.', s:'Widzę więcej, niż pokazuję.', pts:{ egg:3, daeron:1 } },
            { t:'Naturalnego autorytetu.', s:'Ludzie liczą się z moim zdaniem.', pts:{ baelor:3, maekar:1 } },
            { t:'Silnej osobowości, która ożywia towarzystwo.', s:'Wnoszę ruch i śmiałość.', pts:{ lyonel:3, dunk:1 } }
          ]},
          { p:'Najbardziej pociąga Cię wizja życia opartego na…', h:'Który kierunek brzmi dla Ciebie najlepiej?', a:[
            { t:'Honorze i prostocie.', s:'Wolę uczciwe życie niż wielką pozę.', pts:{ dunk:3, baelor:1 } },
            { t:'Przygodzie i poznawaniu świata.', s:'Chcę się uczyć i doświadczać.', pts:{ egg:3, lyonel:1 } },
            { t:'Obowiązku i porządku.', s:'Dobra struktura daje mi siłę.', pts:{ maekar:3, baelor:1 } },
            { t:'Wolności i intensywności.', s:'Lubię czuć, że żyję naprawdę.', pts:{ daeron:3, lyonel:1 } }
          ]},
          { p:'W relacjach najbardziej cenisz…', h:'Co jest dla Ciebie najważniejsze?', a:[
            { t:'Lojalność i uczciwość.', s:'Bez tego nic nie ma sensu.', pts:{ dunk:3, baelor:1 } },
            { t:'Porozumienie i błysk w rozmowie.', s:'Lubię ludzi, z którymi można naprawdę myśleć.', pts:{ egg:3, daeron:1 } },
            { t:'Szacunek i granice.', s:'Bliskość nie wyklucza powagi.', pts:{ maekar:3, baelor:1 } },
            { t:'Swobodę i żywą energię.', s:'Relacja musi mieć w sobie ruch.', pts:{ lyonel:3, dunk:1 } }
          ]},
          { p:'Gdy ktoś Cię źle oceni, najczęściej…', h:'Co dzieje się w Tobie najpierw?', a:[
            { t:'Boli mnie to, ale wolę udowodnić prawdę czynem.', s:'Nie lubię pustych kłótni.', pts:{ dunk:3, baelor:1 } },
            { t:'Zapamiętuję to i analizuję.', s:'Chcę zrozumieć, skąd to się wzięło.', pts:{ egg:3, daeron:1 } },
            { t:'Zamykam się i staję się chłodniejsza.', s:'Nie pokazuję łatwo, że coś mnie dotknęło.', pts:{ maekar:3, daeron:1 } },
            { t:'Reaguję mocniej, niż inni się spodziewają.', s:'Nie lubię, gdy ktoś mnie lekceważy.', pts:{ lyonel:3, maekar:1 } }
          ]},
          { p:'Nowy etap życia chciałabyś zacząć od…', h:'Która wizja jest Ci najbliższa?', a:[
            { t:'Życia bardziej zgodnego z wartościami.', s:'Chcę czuć, że jestem po właściwej stronie siebie.', pts:{ dunk:3, baelor:1 } },
            { t:'Uczenia się i odkrywania nowych rzeczy.', s:'Najbardziej ekscytuje mnie rozwój.', pts:{ egg:3, daeron:1 } },
            { t:'Uporządkowania tego, co chaotyczne.', s:'Chcę większej struktury i stabilności.', pts:{ maekar:3, baelor:1 } },
            { t:'Mocnego wejścia w życie, które naprawdę mnie porwie.', s:'Nie chcę już tkwić w stagnacji.', pts:{ lyonel:3, daeron:1 } }
          ]}
        ]
      }
    };

    let activeQuiz = null;
    let currentQuestion = 0;
    let scores = {};

    const universeGrid = document.getElementById('universe-grid');
    const introBadge = document.getElementById('intro-badge');
    const introTitle = document.getElementById('intro-title');
    const introLead = document.getElementById('intro-lead');
    const introCharacters = document.getElementById('intro-characters');

    function safeLabel(name){
      return name.split(' ')[0];
    }

    function renderHome(){
      universeGrid.innerHTML = Object.values(QUIZZES).map(quiz => `
        <div class="universe-card" onclick="openIntro('${quiz.key}')">
          <div>
            <div class="universe-badge">${quiz.badge}</div>
            <h3 class="universe-title">${quiz.title}</h3>
            <p class="universe-subtitle">${quiz.subtitle}</p>
          </div>
          <div class="chip-row">${quiz.preview.map(item => `<span class="chip">${item}</span>`).join('')}</div>
        </div>
      `).join('');
    }

    function goTo(stepId){
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function handleMissingImage(img){
      const portrait = img.closest('.portrait');
      if(portrait){
        portrait.classList.add('missing');
      }
      img.style.display = 'none';
    }

    function openIntro(quizKey){
      activeQuiz = QUIZZES[quizKey];
      introBadge.textContent = activeQuiz.badge;
      introTitle.textContent = activeQuiz.title;
      introLead.textContent = activeQuiz.intro;

      const previewChars = Object.values(activeQuiz.characters).slice(0, 4);
      introCharacters.innerHTML = previewChars.map(char => `
        <div class="character-card">
          <div class="portrait" data-label="${safeLabel(char.name)}">
            <img src="${char.image}" alt="${char.name}" onerror="handleMissingImage(this)">
          </div>
          <div class="character-name">${safeLabel(char.name)}</div>
        </div>
      `).join('');

      goTo('step-intro');
    }

    function resetScores(){
      scores = {};
      Object.keys(activeQuiz.characters).forEach(key => scores[key] = 0);
    }

    function startQuiz(){
      currentQuestion = 0;
      resetScores();
      renderQuestion();
      goTo('step-quiz');
    }

    function renderQuestion(){
      const q = activeQuiz.questions[currentQuestion];
      const total = activeQuiz.questions.length;
      const pct = Math.round((currentQuestion / total) * 100);

      document.getElementById('q-counter').textContent = `Pytanie ${currentQuestion + 1} z ${total}`;
      document.getElementById('q-pct').textContent = `${pct}%`;
      document.getElementById('progress-fill').style.width = `${pct}%`;

      document.getElementById('question-area').innerHTML = `
        <div class="q-label">${activeQuiz.title} · Pytanie ${currentQuestion + 1}</div>
        <div class="q-title">${q.p}</div>
        <p class="q-hint">${q.h}</p>
        <div class="answers">
          ${q.a.map((answer, i) => `
            <button class="answer" onclick="pickAnswer(${i})">
              ${answer.t}
              <span>${answer.s}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function pickAnswer(index){
      const answer = activeQuiz.questions[currentQuestion].a[index];
      Object.entries(answer.pts).forEach(([key, val]) => { scores[key] += val; });
      currentQuestion += 1;
      if(currentQuestion < activeQuiz.questions.length){
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult(){
      const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
      const [winnerKey, winnerScore] = sorted[0];
      const winner = activeQuiz.characters[winnerKey];
      const tie = sorted[1] && sorted[1][1] === winnerScore;

      document.getElementById('result-badge').textContent = `${activeQuiz.title} · Twój wynik`;
      document.getElementById('result-name').textContent = winner.name;
      document.getElementById('result-desc').textContent = winner.desc;
      document.getElementById('result-extra').textContent = winner.extra + (tie ? ' Twój wynik jest bardzo wyrównany, więc masz w sobie też wyraźny rys drugiej postaci.' : ' To właśnie ta postać najmocniej wybrzmiała w Twoich odpowiedziach.');
      document.getElementById('result-traits').innerHTML = winner.traits.map(trait => `<span class="trait">${trait}</span>`).join('');

      const portrait = document.getElementById('result-portrait');
      const resultImg = document.getElementById('result-img');
      portrait.classList.remove('missing');
      portrait.setAttribute('data-label', safeLabel(winner.name));
      resultImg.style.display = 'block';
      resultImg.src = winner.image;
      resultImg.alt = winner.name;

      const maxScore = Math.max(...Object.values(scores), 1);
      document.getElementById('score-list').innerHTML = sorted.map(([key, val]) => {
        const width = Math.max(8, (val / maxScore) * 100);
        return `
          <div class="score-item">
            <div class="score-head"><strong>${activeQuiz.characters[key].short}</strong><span>${val} pkt</span></div>
            <div class="score-track"><div class="score-fill" style="width:${width}%"></div></div>
          </div>
        `;
      }).join('');

      goTo('step-result');
    }

    function restartCurrentQuiz(){
      if(!activeQuiz) return;
      startQuiz();
    }

    function goHome(){
      activeQuiz = null;
      goTo('step-home');
    }

    renderHome();
  </script>
</body>
</html>
