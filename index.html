<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizy osobowości — Bookverse Quiz Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f9fc;
      --bg-soft:#edf4f8;
      --card:#ffffff;
      --line:#d6e4ee;
      --text:#102131;
      --muted:#526475;
      --accent:#1b6a96;
      --accent-dark:#124f70;
      --accent-soft:#deedf6;
      --shadow:0 20px 48px rgba(12,32,48,.09);
      --pill:999px;
      --radius:28px;
      --theme-name:'light';

      --u-accent:#1b6a96;
      --u-accent-dark:#124f70;
      --u-soft:#deedf6;
      --u-grad-1:#ffffff;
      --u-grad-2:#f9fcff;
      --u-highlight:#f3f8fb;
    }

    body[data-theme="dark"]{
      --bg:#0f1720;
      --bg-soft:#16212b;
      --card:#15202a;
      --line:#294050;
      --text:#edf5fb;
      --muted:#a8bccb;
      --accent:#7ab8dd;
      --accent-dark:#9fd0ec;
      --accent-soft:#1c3140;
      --shadow:0 20px 48px rgba(0,0,0,.28);
    }

    body[data-universe="offcampus"]{
      --u-accent:#b86b8f;
      --u-accent-dark:#9d5276;
      --u-soft:#f8e4ee;
      --u-grad-1:#fffafc;
      --u-grad-2:#fff2f7;
      --u-highlight:#fdf1f6;
    }
    body[data-universe="got"]{
      --u-accent:#8b2f3f;
      --u-accent-dark:#6f2230;
      --u-soft:#f1dde2;
      --u-grad-1:#fffafb;
      --u-grad-2:#f9ecef;
      --u-highlight:#f7ecef;
    }
    body[data-universe="hotd"]{
      --u-accent:#9b3b2f;
      --u-accent-dark:#7d2f25;
      --u-soft:#f4e0db;
      --u-grad-1:#fff9f7;
      --u-grad-2:#faece8;
      --u-highlight:#f8eeeb;
    }
    body[data-universe="knight"]{
      --u-accent:#8a6a2c;
      --u-accent-dark:#715523;
      --u-soft:#f2ead7;
      --u-grad-1:#fffdf8;
      --u-grad-2:#f8f2e5;
      --u-highlight:#faf6eb;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding:24px 12px 56px;
      transition:background .2s ease,color .2s ease;
    }
    h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;line-height:1.08}
    img{display:block;max-width:100%}
    button{font:inherit;cursor:pointer}

    .topbar{
      width:min(1080px,100%);
      margin:0 auto 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .topbar-left{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .topbar-right{display:flex;gap:10px;flex-wrap:wrap}
    .switcher{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--card);
      box-shadow:var(--shadow);
    }
    .switcher button{
      border:none;
      background:transparent;
      color:var(--muted);
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
    }
    .switcher button.active{
      background:var(--u-soft);
      color:var(--u-accent-dark);
    }

    .step{display:none;width:min(1080px,100%);margin:0 auto;animation:fadeIn .24s ease}
    .step.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .home-body{padding:46px 42px 38px}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      padding:8px 14px;
      border-radius:999px;
      background:var(--u-soft);
      color:var(--u-accent-dark);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.14em;
      margin-bottom:18px;
    }
    .home-title{font-size:clamp(2.5rem,5vw,4.3rem);max-width:13ch;margin-bottom:14px}
    .home-lead{color:var(--muted);max-width:68ch;font-size:1.05rem;line-height:1.6;margin-bottom:28px}

    .universe-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }
    .universe-card{
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px 20px;
      background:linear-gradient(180deg,var(--u-grad-1) 0%,var(--u-grad-2) 100%);
      transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
      cursor:pointer;
      min-height:220px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .universe-card:hover{
      transform:translateY(-4px);
      border-color:var(--u-accent);
      box-shadow:0 18px 40px rgba(12,32,48,.12);
    }
    .universe-badge{
      display:inline-flex;
      width:max-content;
      padding:7px 12px;
      border-radius:999px;
      background:var(--u-soft);
      color:var(--u-accent-dark);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:14px;
    }
    .universe-title{font-size:1.8rem;margin-bottom:10px}
    .universe-subtitle{color:var(--muted);line-height:1.55;font-size:.97rem;margin-bottom:18px}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--u-highlight);
      font-size:13px;
      font-weight:700;
      color:var(--text);
    }

    .intro-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:0;align-items:stretch}
    .intro-main{padding:42px 40px 34px}
    .intro-side{
      background:linear-gradient(180deg,var(--u-grad-1) 0%,var(--u-grad-2) 100%);
      border-left:1px solid var(--line);
      padding:30px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .intro-title{font-size:clamp(2.1rem,4vw,3.4rem);margin-bottom:12px;max-width:14ch}
    .intro-lead{color:var(--muted);line-height:1.65;max-width:54ch;margin-bottom:28px}
    .intro-actions{display:flex;flex-wrap:wrap;gap:12px}

    .btn-primary,.btn-secondary,.btn-ghost{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:16px 28px;
      font-weight:800;
      border:none;
      transition:transform .14s ease,background .14s ease,border-color .14s ease,color .14s ease;
    }
    .btn-primary{background:var(--u-accent);color:#fff;box-shadow:0 12px 28px rgba(27,106,150,.22)}
    .btn-primary:hover{background:var(--u-accent-dark);transform:translateY(-1px)}
    .btn-secondary,.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
    .btn-secondary:hover,.btn-ghost:hover{border-color:var(--u-accent);color:var(--u-accent)}

    .character-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .character-card{display:grid;gap:8px}
    .portrait{
      aspect-ratio:3/4;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--line);
      background:var(--bg-soft);
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .portrait img{width:100%;height:100%;object-fit:cover}
    .portrait.missing::after{
      content:attr(data-label);
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:12px;
      color:var(--muted);
      font-weight:800;
      font-size:1rem;
      letter-spacing:.02em;
      background:linear-gradient(180deg,var(--u-grad-1) 0%,var(--u-grad-2) 100%);
    }
    .character-name{text-align:center;font-size:13px;font-weight:700;color:var(--muted)}

    .quiz-body{padding:40px 42px 34px}
    .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--muted)}
    .progress-track{height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden;margin-bottom:30px}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--u-soft),var(--u-accent));border-radius:inherit;transition:width .24s ease}
    .q-label{color:var(--u-accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;margin-bottom:12px}
    .q-title{font-size:clamp(1.45rem,2.4vw,2rem);font-weight:800;line-height:1.26;margin-bottom:10px}
    .q-hint{color:var(--muted);font-size:.96rem;margin-bottom:26px}
    .answers{display:grid;gap:10px}
    .answer{
      width:100%;
      text-align:left;
      background:var(--card);
      border:1.5px solid var(--line);
      border-radius:18px;
      padding:18px 18px 16px;
      font-weight:700;
      color:var(--text);
      transition:border-color .14s ease,box-shadow .14s ease,transform .14s ease;
    }
    .answer:hover,.answer:focus-visible{
      outline:none;
      border-color:var(--u-accent);
      box-shadow:0 8px 24px rgba(12,32,48,.08);
      transform:translateY(-1px);
    }
    .answer span{display:block;margin-top:5px;font-size:13.5px;font-weight:500;color:var(--muted)}

    .result-grid{display:grid;grid-template-columns:300px 1fr}
    .result-media{background:var(--u-grad-2);min-height:100%}
    .result-media .portrait{height:100%;min-height:100%;border:none;border-radius:0;aspect-ratio:auto;background:transparent}
    .result-body{padding:40px 40px 34px}
    .result-name{font-size:clamp(2.1rem,3vw,3.1rem);margin-bottom:12px}
    .result-desc,.result-extra{color:var(--muted);line-height:1.68}
    .result-desc{margin-bottom:14px}
    .result-extra{margin-bottom:20px;font-size:.97rem}
    .traits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
    .trait{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--u-highlight);font-size:13px;font-weight:700}
    .score-list{display:grid;gap:12px;margin-top:10px}
    .score-item{display:grid;gap:6px}
    .score-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
    .score-track{height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden}
    .score-fill{height:100%;background:linear-gradient(90deg,var(--u-soft),var(--u-accent));border-radius:inherit}
    .result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}

    @media(max-width:980px){
      .universe-grid{grid-template-columns:1fr}
      .intro-grid,.result-grid{grid-template-columns:1fr}
      .intro-side{border-left:none;border-top:1px solid var(--line)}
    }
    @media(max-width:680px){
      .home-body,.intro-main,.quiz-body,.result-body{padding:28px 20px 24px}
      .intro-side{padding:22px 20px}
      .character-grid{grid-template-columns:repeat(2,1fr)}
      .result-media .portrait{aspect-ratio:4/3}
      .topbar{align-items:stretch}
    }
  </style>
</head>
<body data-theme="light" data-universe="home">
  <div class="topbar">
    <div class="topbar-left" id="brand-label">Bookverse Quiz Hub</div>
    <div class="topbar-right">
      <div class="switcher" aria-label="Language switcher">
        <button id="lang-pl" class="active" onclick="setLanguage('pl')">PL</button>
        <button id="lang-en" onclick="setLanguage('en')">EN</button>
      </div>
      <div class="switcher" aria-label="Theme switcher">
        <button id="theme-light" class="active" onclick="setTheme('light')">Light</button>
        <button id="theme-dark" onclick="setTheme('dark')">Dark</button>
      </div>
    </div>
  </div>

  <section class="step active" id="step-home">
    <div class="card">
      <div class="home-body">
        <div class="eyebrow" id="home-eyebrow"></div>
        <h1 class="home-title" id="home-title"></h1>
        <p class="home-lead" id="home-lead"></p>
        <div class="universe-grid" id="universe-grid"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-intro">
    <div class="card intro-grid">
      <div class="intro-main">
        <div class="eyebrow" id="intro-badge"></div>
        <h2 class="intro-title" id="intro-title"></h2>
        <p class="intro-lead" id="intro-lead"></p>
        <div class="intro-actions">
          <button class="btn-primary" id="start-btn" onclick="startQuiz()"></button>
          <button class="btn-secondary" id="back-btn" onclick="goHome()"></button>
        </div>
      </div>
      <div class="intro-side">
        <div class="character-grid" id="intro-characters"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-quiz">
    <div class="card">
      <div class="quiz-body">
        <div class="progress-row">
          <span id="q-counter"></span>
          <span id="q-pct">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div id="question-area"></div>
      </div>
    </div>
  </section>

  <section class="step" id="step-result">
    <div class="card result-grid">
      <div class="result-media">
        <div class="portrait" id="result-portrait" data-label="Wynik">
          <img id="result-img" src="" alt="Quiz result" onerror="handleMissingImage(this)">
        </div>
      </div>
      <div class="result-body">
        <div class="eyebrow" id="result-badge"></div>
        <h2 class="result-name" id="result-name"></h2>
        <p class="result-desc" id="result-desc"></p>
        <div class="traits" id="result-traits"></div>
        <p class="result-extra" id="result-extra"></p>
        <div>
          <h3 id="score-title"></h3>
          <div class="score-list" id="score-list"></div>
        </div>
        <div class="result-actions">
          <button class="btn-primary" id="restart-btn" onclick="restartCurrentQuiz()"></button>
          <button class="btn-ghost" id="choose-btn" onclick="goHome()"></button>
        </div>
      </div>
    </div>
  </section>

  <script>
    const UI = {
      pl: {
        title: 'Quizy osobowości — Bookverse Quiz Hub',
        brand: 'Bookverse Quiz Hub',
        homeEyebrow: 'Quiz Hub · Bookverse',
        homeTitle: 'Wybierz uniwersum i sprawdź, która postać najbardziej do Ciebie pasuje',
        start: 'Rozpocznij quiz',
        back: 'Wróć do wyboru',
        questionOf: 'Pytanie {current} z {total}',
        questionLabel: '{title} · Pytanie {current}',
        scoreTitle: 'Rozkład punktów',
        replay: 'Zagraj jeszcze raz',
        chooseAnother: 'Wybierz inny quiz',
        resultLabel: '{title} · Twój wynik',
        tieText: ' Twój wynik jest bardzo wyrównany, więc masz w sobie też wyraźny rys drugiej postaci.',
        resultText: ' To właśnie ta postać najmocniej wybrzmiała w Twoich odpowiedziach.',
        points: 'pkt',
        light: 'Light',
        dark: 'Dark'
      },
      en: {
        title: 'Personality Quizzes — Bookverse Quiz Hub',
        brand: 'Bookverse Quiz Hub',
        homeEyebrow: 'Quiz Hub · Bookverse',
        homeTitle: 'Choose a universe and find out which character matches you best',
        start: 'Start quiz',
        back: 'Back to selection',
        questionOf: 'Question {current} of {total}',
        questionLabel: '{title} · Question {current}',
        scoreTitle: 'Score breakdown',
        replay: 'Play again',
        chooseAnother: 'Choose another quiz',
        resultLabel: '{title} · Your result',
        tieText: ' Your score is very close, so you also show a strong trace of the runner-up character.',
        resultText: ' This is the character that came through most strongly in your answers.',
        points: 'pts',
        light: 'Light',
        dark: 'Dark'
      }
    };

    const QUIZZES = {
      offcampus: {
        previewLimit: 4,
        pl: {
          badge: 'Quiz I',
          title: 'Off-Campus',
          subtitle: 'romans · college · emocje · relacje',
          intro: 'Odpowiedz na pytania o emocje, zaufanie, bliskość i ambicję. Wynik pokaże, która bohaterka Off-Campus najbardziej pasuje do Twojego temperamentu.',
          preview: ['Hannah', 'Grace', 'Sabrina', 'Allie'],
          characters: {
            hannah: { name: 'Hannah Wells', short: 'Hannah', image: './hannah.jpg', traits: ['Wrażliwa','Uważna','Inteligentna','Autentyczna'], desc: 'Najbliżej Ci do Hannah, jeśli cenisz spokój, autentyczność i emocjonalną głębię. Zanim się otworzysz, chcesz czuć bezpieczeństwo i prawdziwe zrozumienie.', extra: 'Twoją siłą nie jest hałas, tylko uważność. Najwięcej znaczą dla Ciebie relacje, w których możesz być sobą bez gry i bez presji.' },
            grace: { name: 'Grace Ivers', short: 'Grace', image: './grace.jpg', traits: ['Delikatna','Empatyczna','Wytrwała','Ciepła'], desc: 'Najbliżej Ci do Grace, jeśli masz w sobie łagodność, która nie oznacza braku siły. Potrafisz długo dojrzewać do decyzji, lecz gdy odnajdziesz siebie, jesteś bardzo konsekwentna.', extra: 'W Twoim sposobie bycia jest dużo miękkości, ale też odporności. Uczysz się relacji powoli, za to bardzo głęboko.' },
            sabrina: { name: 'Sabrina James', short: 'Sabrina', image: './sabrina.jpg', traits: ['Ambitna','Zdyscyplinowana','Niezależna','Silna'], desc: 'Najbliżej Ci do Sabriny, jeśli najważniejsze są dla Ciebie sprawczość, cel i niezależność. Nawet gdy czujesz dużo, nie pokazujesz wszystkiego od razu.', extra: 'Masz wysoki próg wytrzymałości i nie lubisz oddawać swojego życia przypadkowi. Bliskość jest dla Ciebie ważna, ale tylko wtedy, gdy nie odbiera Ci podmiotowości.' },
            allie: { name: 'Allie Hayes', short: 'Allie', image: './allie.jpg', traits: ['Towarzyska','Serdeczna','Żywiołowa','Lojalna'], desc: 'Najbliżej Ci do Allie, jeśli relacje, energia i emocjonalna szczerość są w centrum Twojego świata. Dobrze czujesz ludzi i wnosisz do ich życia ciepło i bliskość.', extra: 'Potrafisz być spontaniczna, ale za tą lekkością stoi prawdziwe przywiązanie. Gdy kochasz, robisz to całym sercem.' }
          },
          questions: [
            { p:'Gdy stajesz przed ważną decyzją życiową, co jest dla Ciebie najważniejsze?', h:'Wybierz to, co brzmi najbardziej naturalnie.', a:[
              { t:'Bezpieczeństwo i niezależność.', s:'Muszę wiedzieć, że ten wybór mnie wzmacnia.', pts:{ sabrina:3, hannah:1 } },
              { t:'Wierność sobie i swoim wartościom.', s:'Nie chcę wygrywać czegoś kosztem siebie.', pts:{ hannah:3, grace:1 } },
              { t:'Wpływ decyzji na relacje z bliskimi.', s:'Nie oddzielam wyborów od ludzi.', pts:{ allie:3, grace:1 } },
              { t:'To, czy wybieram odważnie, a nie ze strachu.', s:'Chcę czuć, że naprawdę idę do przodu.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'Kiedy ktoś Cię rani, najczęściej…', h:'Pomyśl o swoim pierwszym odruchu.', a:[
              { t:'Wycofuję się i potrzebuję czasu.', s:'Zaufanie odbudowuję powoli.', pts:{ hannah:3, grace:1 } },
              { t:'Rozmawiam od razu.', s:'Wolę wyjaśnić niż dusić emocje.', pts:{ allie:3, hannah:1 } },
              { t:'Analizuję, czy ta relacja w ogóle jest dla mnie dobra.', s:'Nie chcę inwestować w coś, co mnie osłabia.', pts:{ sabrina:3, hannah:1 } },
              { t:'Próbuję zrozumieć, ale długo to noszę w sobie.', s:'Empatia nie wyklucza bólu.', pts:{ grace:3, allie:1 } }
            ]},
            { p:'Twoją największą siłą w relacjach jest…', h:'Wybierz cechę, którą w sobie najbardziej rozpoznajesz.', a:[
              { t:'Uważność i szczerość.', s:'Ludzie czują, że naprawdę ich słucham.', pts:{ hannah:3, grace:1 } },
              { t:'Ciepło i obecność.', s:'Wnoszę energię i bliskość.', pts:{ allie:3, hannah:1 } },
              { t:'Stabilność i samodzielność.', s:'Nie gubię siebie nawet w silnych emocjach.', pts:{ sabrina:3, grace:1 } },
              { t:'Łagodność i wyrozumiałość.', s:'Nie oceniam pochopnie.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'W nowym środowisku zwykle…', h:'Nie chodzi o ideał, tylko o prawdziwy odruch.', a:[
              { t:'Najpierw obserwuję.', s:'Wolę najpierw wyczuć ludzi.', pts:{ hannah:3, grace:1 } },
              { t:'Szukam jednej bezpiecznej osoby.', s:'Potrzebuję miękkiego wejścia.', pts:{ grace:3, allie:1 } },

              { t:'Skupiam się na celu i zadaniu.', s:'Nie potrzebuję aprobaty, żeby działać.', pts:{ sabrina:3, hannah:1 } }
            ]},
            { p:'Najtrudniejsze w bliskości jest dla Ciebie…', h:'Wybierz odpowiedź, która najmocniej Cię dotyka.', a:[

              { t:'Oddanie komuś kontroli nad tym, co czuję.', s:'Nie lubię odsłaniać słabości za szybko.', pts:{ sabrina:3, hannah:1 } },

            { p:'Kiedy jesteś przeciążona, zwykle…', h:'Pomyśl, co robisz najpierw.', a:[

              { t:'Idę do bliskiej osoby.', s:'Rozmowa pomaga mi odzyskać równowagę.', pts:{ allie:3, hannah:1 } },
              { t:'Najpierw to przeczekuję, potem się otwieram.', s:'Nie pokazuję wszystkiego od razu.', pts:{ grace:3, hannah:1 } }

            { p:'Co najbardziej chcesz chronić w swojej przyszłości?', h:'To pytanie o Twój rdzeń.', a:[
              { t:'Niezależność.', s:'Nie chcę być od nikogo życiowo zależna.', pts:{ sabrina:3, hannah:1 } },

              { t:'Zdolność kochania ludzi otwarcie.', s:'Nie chcę zamknąć serca.', pts:{ allie:3, grace:1 } },

            ]},
            { p:'Kiedy masz rację, ale jej wypowiedzenie może zranić kogoś bliskiego…', h:'Jak reagujesz najczęściej?', a:[
              { t:'Mówię wprost.', s:'Prawda jest ważniejsza niż pozorny spokój.', pts:{ sabrina:3, allie:1 } },
              { t:'Szukam delikatnego sposobu.', s:'Chcę być uczciwa, ale nie okrutna.', pts:{ hannah:3, grace:1 } },
              { t:'Najpierw myślę o konsekwencjach dla relacji.', s:'Liczy się dla mnie nie tylko co, ale też jak.', pts:{ allie:3, hannah:1 } },
              { t:'Długo układam to w sobie.', s:'Konflikt kosztuje mnie więcej, niż pokazuję.', pts:{ grace:3, hannah:1 } }

              { t:'Wspiera Cię bez odbierania sprawczości.', s:'Pomoc ma wzmacniać, nie przejmować sterów.', pts:{ sabrina:3, grace:1 } },

        en: {
          badge: 'Quiz I', title: 'Off-Campus', subtitle: 'romance · college · emotions · relationships', intro: 'Answer questions about emotions, trust, closeness, and ambition. Your result will show which Off-Campus heroine best matches your temperament.', preview: ['Hannah', 'Grace', 'Sabrina', 'Allie'],
          characters: {
            hannah: { name: 'Hannah Wells', short: 'Hannah', image: './hannah.jpg', traits: ['Sensitive','Attentive','Intelligent','Authentic'], desc: 'You are closest to Hannah if you value calm, authenticity, and emotional depth. Before you open up, you need to feel safe and truly understood.', extra: 'Your strength is not noise but attentiveness. What matters most to you are relationships where you can be yourself without pressure.' },
            grace: { name: 'Grace Ivers', short: 'Grace', image: './grace.jpg', traits: ['Gentle','Empathetic','Steady','Warm'], desc: 'You are closest to Grace if you carry softness that does not mean weakness. You may take time to grow into your choices, but once you find yourself, you become deeply consistent.', extra: 'There is tenderness in the way you move through the world, but also resilience. You learn closeness slowly and deeply.' },
            sabrina: { name: 'Sabrina James', short: 'Sabrina', image: './sabrina.jpg', traits: ['Ambitious','Disciplined','Independent','Strong'], desc: 'You are closest to Sabrina if agency, purpose, and independence matter most to you. Even when you feel deeply, you do not reveal everything right away.', extra: 'You have a high threshold for pressure and do not like leaving your life to chance. Closeness matters to you only if it does not take away your autonomy.' },
            allie: { name: 'Allie Hayes', short: 'Allie', image: './allie.jpg', traits: ['Social','Warm','Lively','Loyal'], desc: 'You are closest to Allie if relationships, energy, and emotional honesty are at the center of your world. You read people well and bring warmth and closeness into their lives.', extra: 'You can be spontaneous, but beneath that lightness there is real attachment. When you love, you do it wholeheartedly.' }
          },
          questions: [
            { p:'When you face an important life decision, what matters most to you?', h:'Choose what feels most natural.', a:[
              { t:'Security and independence.', s:'I need to know this choice makes me stronger.', pts:{ sabrina:3, hannah:1 } },
              { t:'Staying true to myself and my values.', s:'I do not want to win something at the cost of myself.', pts:{ hannah:3, grace:1 } },
              { t:'How the decision affects my close relationships.', s:'I do not separate choices from people.', pts:{ allie:3, grace:1 } },
              { t:'Whether I am choosing bravely rather than out of fear.', s:'I want to feel that I am truly moving forward.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'When someone hurts you, you usually…', h:'Think of your first instinct.', a:[
              { t:'Withdraw and need time.', s:'Trust comes back slowly for me.', pts:{ hannah:3, grace:1 } },
              { t:'Talk about it right away.', s:'I would rather clear it up than bottle it up.', pts:{ allie:3, hannah:1 } },
              { t:'Analyze whether the relationship is even good for me.', s:'I do not want to invest in something that weakens me.', pts:{ sabrina:3, hannah:1 } },
              { t:'Try to understand it, but carry it for a long time.', s:'Empathy does not cancel pain.', pts:{ grace:3, allie:1 } }
            ]},
            { p:'Your greatest strength in relationships is…', h:'Choose the trait you recognize most in yourself.', a:[
              { t:'Attentiveness and honesty.', s:'People feel that I truly listen.', pts:{ hannah:3, grace:1 } },
              { t:'Warmth and presence.', s:'I bring energy and closeness.', pts:{ allie:3, hannah:1 } },
              { t:'Stability and self-reliance.', s:'I do not lose myself even in strong emotions.', pts:{ sabrina:3, grace:1 } },
              { t:'Gentleness and understanding.', s:'I do not judge too quickly.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'In a new environment, you usually…', h:'This is about your real instinct, not the ideal version.', a:[
              { t:'Observe first.', s:'I prefer to get a feel for people.', pts:{ hannah:3, grace:1 } },
              { t:'Look for one safe person.', s:'I need a softer entry.', pts:{ grace:3, allie:1 } },
              { t:'Start connecting right away.', s:'I feel better in motion than in suspension.', pts:{ allie:3, hannah:1 } },
              { t:'Focus on the goal and the task.', s:'I do not need approval to act.', pts:{ sabrina:3, hannah:1 } }
            ]},
            { p:'The hardest thing about closeness for you is…', h:'Choose the answer that hits you most deeply.', a:[
              { t:'Trusting without a guarantee I will not be hurt.', s:'Safety is essential for me.', pts:{ hannah:3, grace:1 } },
              { t:'Giving someone control over what I feel.', s:'I do not like revealing weakness too quickly.', pts:{ sabrina:3, hannah:1 } },
              { t:'Feeling everything very intensely.', s:'My emotions can be huge.', pts:{ allie:3, grace:1 } },
              { t:'Believing I truly deserve love.', s:'Closeness also activates fear in me.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'When you are overwhelmed, you usually…', h:'Think about what you do first.', a:[
              { t:'Try to manage everything even harder.', s:'Control gives me a sense of safety.', pts:{ sabrina:3, grace:1 } },
              { t:'Look for silence and space.', s:'I need to return to myself.', pts:{ hannah:3, grace:1 } },
              { t:'Go to a close person.', s:'Talking helps me regain balance.', pts:{ allie:3, hannah:1 } },
              { t:'Wait it out first, then open up.', s:'I do not show everything immediately.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'What do you most want to protect in your future?', h:'This question is about your core.', a:[
              { t:'Independence.', s:'I do not want to be dependent on anyone.', pts:{ sabrina:3, hannah:1 } },
              { t:'Sensitivity and honesty toward myself.', s:'I do not want to harden just to survive.', pts:{ hannah:3, grace:1 } },
              { t:'The ability to love people openly.', s:'I do not want to close my heart.', pts:{ allie:3, grace:1 } },
              { t:'Peace and gentleness toward myself.', s:'I want less fear and more breathing room.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'When you are right but saying it might hurt someone close to you…', h:'How do you usually react?', a:[
              { t:'I say it directly.', s:'Truth matters more than surface peace.', pts:{ sabrina:3, allie:1 } },
              { t:'I look for a gentle way.', s:'I want to be honest but not cruel.', pts:{ hannah:3, grace:1 } },
              { t:'I think first about the effect on the relationship.', s:'For me it is not just what but how.', pts:{ allie:3, hannah:1 } },
              { t:'I carry it inside for a while.', s:'Conflict costs me more than I show.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'You are most moved when someone…', h:'Choose the answer that feels most like you.', a:[
              { t:'Truly sees your inner world.', s:'Being understood means everything to me.', pts:{ hannah:3, grace:1 } },
              { t:'Supports you without taking away your agency.', s:'Help should strengthen me, not take over.', pts:{ sabrina:3, grace:1 } },
              { t:'Offers warmth and everyday presence.', s:'I like love to show up in simple things.', pts:{ allie:3, hannah:1 } },
              { t:'Is patient while you learn to trust.', s:'Safety builds slowly in me.', pts:{ grace:3, hannah:1 } }
            ]},
            { p:'You would like to begin a new chapter of life with…', h:'Choose the vision that attracts you most.', a:[
              { t:'Full agency.', s:'I want to set the terms of my own life.', pts:{ sabrina:3, grace:1 } },
              { t:'Authenticity.', s:'I want to live without hiding myself.', pts:{ hannah:3, grace:1 } },
              { t:'Relationships that bring warmth and community.', s:'For me, meaning grows through togetherness.', pts:{ allie:3, hannah:1 } },
              { t:'Recovered peace.', s:'I want to build a life without constant tension.', pts:{ grace:3, hannah:1 } }
            ]}
          ]
        }
      },

            arya:{name:'Arya Stark',short:'Arya',image:'./arya.jpg',traits:['Niezależna','Buntownicza','Odważna','Nieprzewidywalna'],desc:'Najbliżej Ci do Aryi, jeśli cenisz wolność bardziej niż oczekiwania innych. Nie boisz się iść własną ścieżką, nawet gdy nikt wokół jej nie rozumie.',extra:'Masz mocny instynkt i dużą odporność. Najlepiej działasz wtedy, gdy możesz być całkowicie sobą.'},
            sansa:{name:'Sansa Stark',short:'Sansa',image:'./sansa.jpg',traits:['Strategiczna','Opanowana','Wytrwała','Uważna'],desc:'Najbliżej Ci do Sansy, jeśli uczysz się świata przez obserwację, cierpliwość i analizę ludzi. Potrafisz przetrwać trudne rzeczy bez utraty godności.',extra:'Twoją siłą nie musi być krzyk. Czasem największą przewagą jest umiejętność patrzenia dalej niż inni.'},
            tyrion:{name:'Tyrion Lannister',short:'Tyrion',image:'./tyrion.jpg',traits:['Błyskotliwy','Refleksyjny','Cyniczny','Empatyczny'],desc:'Najbliżej Ci do Tyriona, jeśli cenisz inteligencję, ironię i zdolność widzenia świata z wielu stron. Nawet w chaosie próbujesz myśleć jasno.',extra:'Masz umysł, który nie lubi prostych odpowiedzi. Potrafisz łączyć dystans z prawdziwym zrozumieniem ludzi.'},
            cersei:{name:'Cersei Lannister',short:'Cersei',image:'./cersei.jpg',traits:['Dumna','Kontrolująca','Silna','Polityczna'],desc:'Najbliżej Ci do Cersei, jeśli nie oddajesz kontroli łatwo i bardzo poważnie traktujesz lojalność wobec własnego kręgu. Wiesz, że świat bywa brutalny, więc nauczyłaś się być twarda.',extra:'Masz silny instynkt przetrwania i ogromną wolę. Nie lubisz bezradności i wolisz działać, niż czekać na cudzą decyzję.'}

    }

    function setTheme(next){
      theme = next;
      document.body.setAttribute('data-theme', next);
      document.getElementById('theme-light').classList.toggle('active', next === 'light');
      document.getElementById('theme-dark').classList.toggle('active', next === 'dark');
    }

    function setUniverseTheme(key){
      document.body.setAttribute('data-universe', key || 'home');
    }

    function renderHome(){
      universeGrid.innerHTML = Object.entries(QUIZZES).map(([key, val]) => {
        const quiz = val[lang];
        return `
          <div class="universe-card" onclick="openIntro('${key}')">
            <div>
              <div class="universe-badge">${quiz.badge}</div>
              <h3 class="universe-title">${quiz.title}</h3>
              <p class="universe-subtitle">${quiz.subtitle}</p>
            </div>
            <div class="chip-row">${quiz.preview.map(item => `<span class="chip">${item}</span>`).join('')}</div>
          </div>
        `;
      }).join('');
    }

    function goTo(stepId){
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function handleMissingImage(img){
      const portrait = img.closest('.portrait');
      if(portrait){ portrait.classList.add('missing'); }
      img.style.display = 'none';
    }

    function renderIntro(){
      const activeQuiz = getActiveQuiz();
      if(!activeQuiz) return;
      introBadge.textContent = activeQuiz.badge;
      introTitle.textContent = activeQuiz.title;
      introLead.textContent = activeQuiz.intro;
      const previewChars = Object.values(activeQuiz.characters).slice(0, 4);
      introCharacters.innerHTML = previewChars.map(char => `
        <div class="character-card">
          <div class="portrait" data-label="${safeLabel(char.name)}">
            <img src="${char.image}" alt="${char.name}" onerror="handleMissingImage(this)">
          </div>
          <div class="character-name">${safeLabel(char.name)}</div>
        </div>
      `).join('');
    }

    function openIntro(quizKey){
      activeQuizKey = quizKey;
      setUniverseTheme(quizKey);
      renderIntro();
      goTo('step-intro');
    }

    function resetScores(){
      scores = {};
      const activeQuiz = getActiveQuiz();
      Object.keys(activeQuiz.characters).forEach(key => scores[key] = 0);
    }

    function startQuiz(){
      currentQuestion = 0;
      resetScores();
      renderQuestion();
      goTo('step-quiz');
    }

    function renderQuestion(){
      const activeQuiz = getActiveQuiz();
      const q = activeQuiz.questions[currentQuestion];
      const total = activeQuiz.questions.length;
      const pct = Math.round((currentQuestion / total) * 100);

      document.getElementById('q-counter').textContent = t('questionOf', { current: currentQuestion + 1, total });
      document.getElementById('q-pct').textContent = `${pct}%`;
      document.getElementById('progress-fill').style.width = `${pct}%`;

      document.getElementById('question-area').innerHTML = `
        <div class="q-label">${t('questionLabel', { title: activeQuiz.title, current: currentQuestion + 1 })}</div>
        <div class="q-title">${q.p}</div>
        <p class="q-hint">${q.h}</p>
        <div class="answers">
          ${q.a.map((answer, i) => `
            <button class="answer" onclick="pickAnswer(${i})">
              ${answer.t}
              <span>${answer.s}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function pickAnswer(index){
      const activeQuiz = getActiveQuiz();
      const answer = activeQuiz.questions[currentQuestion].a[index];
      Object.entries(answer.pts).forEach(([key, val]) => { scores[key] += val; });
      currentQuestion += 1;
      if(currentQuestion < activeQuiz.questions.length){ renderQuestion(); }
      else { showResult(); }
    }

    function showResult(){
      const activeQuiz = getActiveQuiz();
      const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
      const [winnerKey, winnerScore] = sorted[0];
      const winner = activeQuiz.characters[winnerKey];
      const tie = sorted[1] && sorted[1][1] === winnerScore;

      document.getElementById('result-badge').textContent = t('resultLabel', { title: activeQuiz.title });
      document.getElementById('result-name').textContent = winner.name;
      document.getElementById('result-desc').textContent = winner.desc;
      document.getElementById('result-extra').textContent = winner.extra + (tie ? t('tieText') : t('resultText'));
      document.getElementById('result-traits').innerHTML = winner.traits.map(trait => `<span class="trait">${trait}</span>`).join('');

      const portrait = document.getElementById('result-portrait');
      const resultImg = document.getElementById('result-img');
      portrait.classList.remove('missing');
      portrait.setAttribute('data-label', safeLabel(winner.name));
      resultImg.style.display = 'block';
      resultImg.src = winner.image;
      resultImg.alt = winner.name;

      const maxScore = Math.max(...Object.values(scores), 1);
      document.getElementById('score-list').innerHTML = sorted.map(([key, val]) => {
        const width = Math.max(8, (val / maxScore) * 100);
        return `
          <div class="score-item">
            <div class="score-head"><strong>${activeQuiz.characters[key].short}</strong><span>${val} ${t('points')}</span></div>
            <div class="score-track"><div class="score-fill" style="width:${width}%"></div></div>
          </div>
        `;
      }).join('');

      goTo('step-result');
    }

    function restartCurrentQuiz(){ if(activeQuizKey) startQuiz(); }
    function goHome(){ activeQuizKey = null; setUniverseTheme('home'); goTo('step-home'); }

    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');
    setLanguage('pl');
    setUniverseTheme('home');
  </script>
</body>
</html>
