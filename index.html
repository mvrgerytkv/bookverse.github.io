<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Off-Campus — Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f9fc;
      --card:#ffffff;
      --line:#d5e3ee;
      --text:#0c2030;
      --muted:#4e6070;
      --accent:#1b6a96;
      --accent-dark:#134f70;
      --accent-soft:#deedf6;
      --pill:999px;
      --shadow:0 20px 48px rgba(12,32,48,.09);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:24px 12px 48px;
    }

    h1,h2,h3{
      font-family:'DM Serif Display',Georgia,serif;
      line-height:1.1;
    }

    img{
      display:block;
      max-width:100%;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    .step{
      display:none;
      width:min(820px,100%);
      animation:fadeIn .28s ease;
    }

    .step.active{
      display:block;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    .hero-card,
    .quiz-card,
    .result-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .hero-body{
      padding:48px 44px 36px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      padding:8px 14px;
      border-radius:var(--pill);
      background:var(--accent-soft);
      color:var(--accent);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.14em;
      margin-bottom:20px;
    }

    .hero-title{
      font-size:clamp(2.4rem,5vw,3.8rem);
      margin-bottom:16px;
      max-width:14ch;
    }

    .hero-lead{
      color:var(--muted);
      font-size:1.05rem;
      max-width:52ch;
      margin-bottom:32px;
    }

    .hero-chars{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:36px;
    }

    .char-thumb{
      border-radius:16px;
      overflow:hidden;
      aspect-ratio:3/4;
      border:1px solid var(--line);
      background:#eef5f9;
    }

    .char-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .char-name{
      text-align:center;
      font-size:13px;
      font-weight:700;
      margin-top:8px;
      color:var(--muted);
    }

    .btn-primary{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:18px 40px;
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:var(--pill);
      font-size:1.05rem;
      font-weight:800;
      box-shadow:0 12px 28px rgba(27,106,150,.22);
      transition:background .15s,transform .15s;
    }

    .btn-primary:hover{
      background:var(--accent-dark);
      transform:translateY(-1px);
    }

    .quiz-card{
      padding:40px 44px 36px;
    }

    .progress-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      font-size:13px;
      font-weight:700;
      color:var(--muted);
    }

    .progress-track{
      height:8px;
      background:#d8e8f0;
      border-radius:var(--pill);
      overflow:hidden;
      margin-bottom:32px;
    }

    .progress-fill{
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,#9ecee8,var(--accent));
      transition:width .3s ease;
    }

    .q-label{
      color:var(--accent);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.14em;
      margin-bottom:12px;
    }

    .q-title{
      font-size:clamp(1.4rem,2.2vw,1.9rem);
      font-weight:800;
      color:#071520;
      margin-bottom:10px;
      line-height:1.25;
    }

    .q-hint{
      color:var(--muted);
      font-size:.95rem;
      margin-bottom:28px;
    }

    .answers{
      display:grid;
      gap:10px;
    }

    .answer{
      width:100%;
      text-align:left;
      background:#fff;
      border:1.5px solid #c5d8e6;
      border-radius:16px;
      padding:18px 18px 16px;
      font-weight:700;
      color:var(--text);
      transition:border-color .15s,box-shadow .15s,transform .15s;
    }

    .answer:hover,
    .answer:focus-visible{
      border-color:var(--accent);
      box-shadow:0 8px 24px rgba(12,32,48,.08);
      transform:translateY(-1px);
      outline:none;
    }

    .answer span{
      display:block;
      margin-top:5px;
      font-size:13.5px;
      font-weight:500;
      color:var(--muted);
    }

    .result-inner{
      display:grid;
      grid-template-columns:280px 1fr;
      gap:0;
    }

    .result-photo{
      aspect-ratio:3/4;
      overflow:hidden;
      background:#eef5f9;
    }

    .result-photo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .result-body{
      padding:40px 40px 36px;
    }

    .result-chip{
      display:inline-flex;
      padding:8px 14px;
      border-radius:var(--pill);
      background:var(--accent-soft);
      color:var(--accent);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.14em;
      margin-bottom:14px;
    }

    .result-name{
      font-size:clamp(2rem,3vw,3rem);
      margin-bottom:14px;
    }

    .result-desc{
      color:var(--muted);
      margin-bottom:16px;
      line-height:1.65;
    }

    .result-extra{
      color:var(--muted);
      font-size:.95rem;
      margin-bottom:22px;
      line-height:1.65;
    }

    .traits{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:28px;
    }

    .trait{
      padding:9px 13px;
      border-radius:var(--pill);
      border:1px solid var(--line);
      background:#f1f6fa;
      font-size:13.5px;
      font-weight:700;
    }

    .scores{
      margin-top:20px;
    }

    .scores h3{
      font-size:1.1rem;
      margin-bottom:14px;
    }

    .score-item{
      display:grid;
      gap:5px;
      margin-bottom:12px;
    }

    .score-head{
      display:flex;
      justify-content:space-between;
      font-size:13px;
      font-weight:700;
    }

    .score-track{
      height:8px;
      background:#d8e8f0;
      border-radius:var(--pill);
      overflow:hidden;
    }

    .score-fill{
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,#9ecee8,var(--accent));
    }

    .btn-reset{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:16px 32px;
      background:transparent;
      color:var(--text);
      border:1.5px solid var(--line);
      border-radius:var(--pill);
      font-weight:800;
      margin-top:16px;
      transition:border-color .15s,color .15s;
    }

    .btn-reset:hover{
      border-color:var(--accent);
      color:var(--accent);
    }

    @media(max-width:680px){
      .hero-body{
        padding:28px 20px 24px;
      }

      .hero-chars{
        grid-template-columns:repeat(2,1fr);
      }

      .quiz-card{
        padding:28px 20px 24px;
      }

      .result-inner{
        grid-template-columns:1fr;
      }

      .result-photo{
        aspect-ratio:4/3;
      }

      .result-body{
        padding:24px 20px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="step active" id="step-0">
    <div class="hero-card">
      <div class="hero-body">
        <div class="eyebrow">Briar U · Lód · Hokej</div>
        <h1 class="hero-title">Którą bohaterką Off-Campus jesteś?</h1>
        <p class="hero-lead">Odpowiedz na 15 pytań i sprawdź, do której bohaterki jesteś najbardziej podobna.</p>

        <div class="hero-chars">
          <div>
            <div class="char-thumb"><img src="./hannah2.jpg" alt="Hannah Wells"></div>
            <div class="char-name">Hannah</div>
          </div>
          <div>
            <div class="char-thumb"><img src="./grace2.jpg" alt="Grace Ivers"></div>
            <div class="char-name">Grace</div>
          </div>
          <div>
            <div class="char-thumb"><img src="./sabrina2.jpg" alt="Sabrina James"></div>
            <div class="char-name">Sabrina</div>
          </div>
          <div>
            <div class="char-thumb"><img src="./allie2.jpg" alt="Allie Hayes"></div>
            <div class="char-name">Allie</div>
          </div>
        </div>

        <button class="btn-primary" onclick="startQuiz()">Rozpocznij quiz</button>
      </div>
    </div>
  </div>

  <div class="step" id="step-quiz">
    <div class="quiz-card">
      <div class="progress-row">
        <span id="q-counter">Pytanie 1 z 15</span>
        <span id="q-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div id="question-area"></div>
    </div>
  </div>

  <div class="step" id="step-result">
    <div class="result-card">
      <div class="result-inner">
        <div class="result-photo">
          <img id="result-img" src="./hannah2.jpg" alt="Wynik quizu">
        </div>
        <div class="result-body">
          <div class="result-chip">Twój wynik</div>
          <div class="result-name" id="result-name"></div>
          <p class="result-desc" id="result-desc"></p>
          <div class="traits" id="result-traits"></div>
          <p class="result-extra" id="result-extra"></p>

          <div class="scores">
            <h3>Rozkład punktów</h3>
            <div id="score-list"></div>
          </div>

          <button class="btn-reset" onclick="goTo(0);resetQuiz()">Zacznij od nowa</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CHARACTERS = {
      hannah: {
        name: "Hannah Wells",
        short: "Hannah",
        image: "./hannah2.jpg",
        imageAlt: "Hannah Wells",
        traits: ["Wrażliwa", "Uważna", "Inteligentna", "Autentyczna"],
        desc: "Najbliżej Ci do Hannah, jeśli cenisz spokój, autentyczność i emocjonalną głębię. Zanim się otworzysz, chcesz czuć bezpieczeństwo i prawdziwe zrozumienie.",
        extra: "Twoją siłą nie jest hałas, tylko uważność. Najwięcej znaczą dla Ciebie relacje, w których możesz być sobą bez gry i bez presji."
      },
      grace: {
        name: "Grace Ivers",
        short: "Grace",
        image: "./grace2.jpg",
        imageAlt: "Grace Ivers",
        traits: ["Delikatna", "Empatyczna", "Wytrwała", "Ciepła"],
        desc: "Najbliżej Ci do Grace, jeśli masz w sobie łagodność, która nie oznacza braku siły. Potrafisz długo dojrzewać do decyzji, lecz gdy odnajdziesz siebie, jesteś bardzo konsekwentna.",
        extra: "W Twoim sposobie bycia jest dużo miękkości, ale też odporności. Uczysz się relacji powoli, za to bardzo głęboko."
      },
      sabrina: {
        name: "Sabrina James",
        short: "Sabrina",
        image: "./sabrina2.jpg",
        imageAlt: "Sabrina James",
        traits: ["Ambitna", "Zdyscyplinowana", "Niezależna", "Silna"],
        desc: "Najbliżej Ci do Sabriny, jeśli najważniejsze są dla Ciebie sprawczość, cel i niezależność. Nawet gdy czujesz dużo, nie pokazujesz wszystkiego od razu, bo bezpieczeństwo budujesz przez kontrolę.",
        extra: "Masz wysoki próg wytrzymałości i nie lubisz oddawać swojego życia przypadkowi. Bliskość jest dla Ciebie ważna, ale tylko wtedy, gdy nie odbiera Ci podmiotowości."
      },
      allie: {
        name: "Allie Hayes",
        short: "Allie",
        image: "./allie2.jpg",
        imageAlt: "Allie Hayes",
        traits: ["Towarzyska", "Serdeczna", "Żywiołowa", "Lojalna"],
        desc: "Najbliżej Ci do Allie, jeśli relacje, energia i emocjonalna szczerość są w centrum Twojego świata. Dobrze czujesz ludzi i wnosisz do ich życia ciepło, ruch i poczucie bliskości.",
        extra: "Potrafisz być spontaniczna, ale za tą lekkością stoi prawdziwe przywiązanie. Gdy kochasz, robisz to całym sercem."
      }
    };

    const QUESTIONS = [
      {
        p: "Masz przed sobą ważną decyzję, która może znacząco zmienić Twoje życie, ale żadna opcja nie daje pełnej gwarancji powodzenia. Co jest dla Ciebie najważniejsze przy wyborze?",
        h: "Pomyśl o tym, co uruchamia się w Tobie jako pierwsze.",
        a: [
          { t: "To, czy decyzja daje mi realną szansę na niezależność i bezpieczeństwo.", s: "Najpierw liczy się dla mnie stabilność i przyszłość.", pts: { sabrina: 3, hannah: 1 } },
          { t: "To, czy będę mogła pozostać sobą i nie zdradzić własnych wartości.", s: "Nie chcę wygrać czegoś kosztem siebie.", pts: { hannah: 3, grace: 1 } },
          { t: "To, czy ta decyzja nie zniszczy ważnych dla mnie relacji.", s: "Nie umiem oddzielić wyborów od ludzi.", pts: { allie: 3, grace: 1 } },
          { t: "To, czy po czasie będę mogła powiedzieć, że wybrałam odważnie, a nie ze strachu.", s: "Muszę czuć, że nie uciekam przed życiem.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Kiedy ktoś bliski Cię zawodzi, ale nie zrobił tego z czystej złośliwości, jak najczęściej reagujesz?",
        h: "Nie chodzi o ideał, tylko o Twój odruch.",
        a: [
          { t: "Wycofuję się i potrzebuję czasu, zanim znowu wpuszczę tę osobę bliżej.", s: "Zaufanie jest dla mnie czymś kruchym.", pts: { hannah: 3, grace: 1 } },
          { t: "Rozmawiam od razu, bo wolę wyjaśnić wszystko, zanim emocje narosną.", s: "Nie lubię długo żyć w napięciu.", pts: { allie: 3, hannah: 1 } },
          { t: "Analizuję sytuację chłodno i sprawdzam, czy ta relacja dalej mi się opłaca emocjonalnie.", s: "Nie chcę inwestować w coś, co mnie osłabia.", pts: { sabrina: 3, hannah: 1 } },
          { t: "Próbuję zrozumieć drugą stronę, ale jednocześnie długo noszę to w sobie.", s: "Empatia nie wyklucza zranienia.", pts: { grace: 3, allie: 1 } }
        ]
      },
      {
        p: "Wyobraź sobie, że przez dłuższy czas wszystko w Twoim życiu wygląda dobrze z zewnątrz, ale w środku czujesz coraz większy ciężar. Co robisz najpierw?",
        h: "To pytanie dotyczy Twojego sposobu radzenia sobie z przeciążeniem.",
        a: [
          { t: "Próbuję jeszcze mocniej wszystko uporządkować i ogarnąć samodzielnie.", s: "Mam poczucie, że jeśli odpuszczę, wszystko się rozsypie.", pts: { sabrina: 3, grace: 1 } },
          { t: "Szukam ciszy i przestrzeni, żeby zrozumieć, co naprawdę czuję.", s: "Potrzebuję wrócić do siebie, zanim ruszę dalej.", pts: { hannah: 3, grace: 1 } },
          { t: "Idę do kogoś bliskiego, bo wiem, że sama utknę w swoich emocjach.", s: "Rozmowa pomaga mi odzyskać równowagę.", pts: { allie: 3, hannah: 1 } },
          { t: "Najpierw próbuję to przeczekać, ale potem szukam bezpiecznego miejsca, w którym mogę się odsłonić.", s: "Nie otwieram się szybko, ale nie chcę też zostać z tym sama.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Jesteś w relacji, która daje Ci dużo emocji, ale wymaga odsłonięcia się bardziej, niż to dla Ciebie wygodne. Co jest dla Ciebie największym wyzwaniem?",
        h: "Pomyśl, gdzie najczęściej pojawia się opór.",
        a: [
          { t: "To, że ktoś może zobaczyć moje słabsze strony, zanim sama nad nimi zapanuję.", s: "Nie lubię oddawać kontroli.", pts: { sabrina: 3, hannah: 1 } },
          { t: "To, że muszę zaufać, zanim mam pewność, że nie zostanę zraniona.", s: "Bezpieczeństwo jest dla mnie warunkiem bliskości.", pts: { hannah: 3, grace: 1 } },
          { t: "To, że łatwo angażuję się całym sercem i czasem boję się własnej intensywności.", s: "Mam w sobie dużo emocji i nie zawsze umiem je dawkować.", pts: { allie: 3, grace: 1 } },
          { t: "To, że chcę być blisko, ale trudno mi uwierzyć, że naprawdę na to zasługuję.", s: "Bliskość uruchamia też moje lęki.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Wchodzisz do nowego środowiska, w którym wszyscy wydają się pewni siebie i już dobrze się znają. Jak próbujesz się odnaleźć?",
        h: "Nie myśl o tym, jak wypadałoby zareagować, tylko jak reagujesz naprawdę.",
        a: [
          { t: "Obserwuję, zanim zabiorę głos, bo wolę najpierw wyczuć ludzi i dynamikę miejsca.", s: "Nie otwieram się od razu.", pts: { hannah: 3, grace: 1 } },
          { t: "Szukam jednej osoby albo jednego punktu zaczepienia, żeby wejść w to bardziej naturalnie.", s: "Potrzebuję miękkiego startu.", pts: { grace: 3, allie: 1 } },
          { t: "Przejmuję inicjatywę i próbuję szybko wejść w kontakt, żeby skrócić dystans.", s: "Lepiej czuję się w ruchu niż w zawieszeniu.", pts: { allie: 3, hannah: 1 } },
          { t: "Skupiam się na celu swojej obecności i nie przejmuję się, czy ktoś mnie polubi od razu.", s: "Nie potrzebuję aprobaty, żeby działać.", pts: { sabrina: 3, hannah: 1 } }
        ]
      },
      {
        p: "Ktoś mówi Ci, że jesteś zbyt wymagająca, zbyt emocjonalna albo zbyt zamknięta. Co najbardziej Cię w tym porusza?",
        h: "To pytanie jest o miejsce, w które najłatwiej Cię dotknąć.",
        a: [
          { t: "To, że ludzie często mylą moją ostrożność z chłodem.", s: "Nie wszystko, co niewidoczne, jest obojętne.", pts: { hannah: 3, grace: 1 } },
          { t: "To, że moja ambicja bywa oceniana ostrzej niż ambicja innych.", s: "Nie chcę przepraszać za swoją siłę.", pts: { sabrina: 3, allie: 1 } },
          { t: "To, że uczucia są traktowane jak coś gorszego albo mniej dojrzałego.", s: "Dla mnie emocjonalność nie jest słabością.", pts: { allie: 3, hannah: 1 } },
          { t: "To, że ludzie widzą moją delikatność, ale nie widzą, ile mnie kosztuje codzienne funkcjonowanie.", s: "Miękkość też wymaga odwagi.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Masz szansę osiągnąć coś naprawdę dużego, ale wymaga to całkowitego skupienia i ograniczenia życia towarzyskiego. Jak to odbierasz?",
        h: "Pomyśl, co jest dla Ciebie największą ceną.",
        a: [
          { t: "To naturalny koszt, jeśli stawką jest coś, co realnie zmieni moje życie.", s: "Cel bywa ważniejszy niż komfort.", pts: { sabrina: 3, grace: 1 } },
          { t: "Podejmę to tylko wtedy, jeśli nie stracę przez to kontaktu ze sobą.", s: "Sukces bez wewnętrznej spójności niewiele dla mnie znaczy.", pts: { hannah: 3, sabrina: 1 } },
          { t: "Byłoby mi trudno, bo relacje i codzienna bliskość są dla mnie źródłem energii.", s: "Nie umiem dobrze żyć w emocjonalnej izolacji.", pts: { allie: 3, grace: 1 } },
          { t: "Widzę w tym szansę, ale wiem, że bez czułości wobec siebie szybko bym się wypaliła.", s: "Ambicja potrzebuje równowagi.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Ktoś daje Ci szczere wsparcie, ale robi to w sposób, który odbiera Ci sprawczość albo nie respektuje Twojego tempa. Jak to odczuwasz?",
        h: "To pytanie o granice i sposób bycia wspieraną.",
        a: [
          { t: "Źle, bo nawet dobre intencje nie usprawiedliwiają naruszania mojej autonomii.", s: "Pomoc ma wzmacniać, a nie przejmować stery.", pts: { sabrina: 3, grace: 1 } },

        a: [
          { t: "Swoją niezależność i prawo do decydowania o sobie.", s: "Nie chcę być od nikogo życiowo zależna.", pts: { sabrina: 3, hannah: 1 } },
          { t: "Swoją wrażliwość i uczciwość wobec samej siebie.", s: "Nie chcę twardnieć tylko dlatego, że świat tego wymaga.", pts: { hannah: 3, grace: 1 } },
          { t: "Swoją zdolność do kochania ludzi otwarcie i bez gry.", s: "Nie chcę zamknąć serca.", pts: { allie: 3, grace: 1 } },

        ]
      },
      {
        p: "Wiesz, że masz rację, ale jej wypowiedzenie może zachwiać relacją albo wywołać konflikt. Co robisz najczęściej?",
        h: "To pytanie łączy odwagę, lojalność i granice.",
        a: [
          { t: "Mówię wprost, nawet jeśli będzie nieprzyjemnie, bo nie chcę budować niczego na przemilczeniach.", s: "Prawda jest ważniejsza niż pozorny spokój.", pts: { sabrina: 3, allie: 1 } },
          { t: "Szukam sposobu, by powiedzieć to delikatnie, ale uczciwie.", s: "Nie chcę ranić, ale nie chcę też fałszu.", pts: { hannah: 3, grace: 1 } },
          { t: "Myślę o konsekwencjach dla relacji i próbuję wybrać moment, który nie zniszczy bliskości.", s: "Dla mnie ważne jest nie tylko co, ale też jak.", pts: { allie: 3, hannah: 1 } },
          { t: "Długo to w sobie układam, bo konflikt kosztuje mnie emocjonalnie więcej, niż pokazuję.", s: "Nie jestem obojętna, tylko ostrożna.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Ktoś widzi w Tobie potencjał, którego Ty jeszcze w sobie nie uznajesz. Jak najczęściej na to reagujesz?",
        h: "Pomyśl, co pojawia się najpierw: opór, wdzięczność, lęk czy motywacja.",
        a: [
          { t: "Traktuję to jak impuls do działania i chcę udowodnić, że naprawdę mogę więcej.", s: "Presja potrafi mnie mobilizować.", pts: { sabrina: 3, allie: 1 } },
          { t: "Potrzebuję czasu, żeby w to uwierzyć, ale jeśli czuję szczerość, bardzo mnie to porusza.", s: "Wsparcie działa na mnie głęboko, choć nie od razu.", pts: { hannah: 3, grace: 1 } },
          { t: "Cieszę się i od razu chcę dzielić ten moment z kimś bliskim.", s: "Dobre rzeczy mają dla mnie większy sens, gdy są współdzielone.", pts: { allie: 3, hannah: 1 } },
          { t: "Część mnie bardzo tego chce, ale część od razu pyta, czy naprawdę na to zasługuję.", s: "Nadzieja często miesza się u mnie z niepewnością.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Który rodzaj bliskości najbardziej sprawia, że czujesz się kochana i bezpieczna?",
        h: "Nie chodzi o gest idealny, tylko o ten najbardziej prawdziwy.",
        a: [
          { t: "Taki, który szanuje moje granice i nie próbuje mnie definiować.", s: "Miłość nie może odbierać mi samostanowienia.", pts: { sabrina: 3, grace: 1 } },
          { t: "Taki, w którym ktoś naprawdę widzi moje wnętrze i nie boi się mojej złożoności.", s: "Najważniejsze jest dla mnie bycie rozumianą.", pts: { hannah: 3, grace: 1 } },
          { t: "Taki, który daje ciepło, obecność i codzienne potwierdzanie więzi.", s: "Miłość lubię czuć także w prostych rzeczach.", pts: { allie: 3, hannah: 1 } },
          { t: "Taki, który daje mi łagodność i cierpliwość, kiedy sama jeszcze uczę się ufać.", s: "Bezpieczeństwo buduje się we mnie powoli.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Ktoś ocenia Cię wyłącznie po tym, co widać na pierwszy rzut oka. Co byłoby w tym obrazie najbardziej niepełne?",
        h: "To pytanie dotyczy tego, co ukryte pod powierzchnią.",
        a: [
          { t: "To, że moja cisza zostałaby uznana za dystans, a nie za uważność.", s: "Nie wszystko, co spokojne, jest zamknięte.", pts: { hannah: 3, grace: 1 } },
          { t: "To, że moją stanowczość ktoś uznałby za chłód albo brak serca.", s: "Siła nie wyklucza czułości.", pts: { sabrina: 3, hannah: 1 } },
          { t: "To, że moją lekkość ktoś pomyliłby z powierzchownością.", s: "Pod energią jest dużo prawdziwego przywiązania.", pts: { allie: 3, hannah: 1 } },
          { t: "To, że moją delikatność ktoś uznałby za słabość.", s: "Wrażliwość potrafi być bardzo odważna.", pts: { grace: 3, hannah: 1 } }
        ]
      },
      {
        p: "Masz możliwość zacząć nowy etap od zera: nowe miejsce, nowi ludzie, nowa wersja siebie. Co byłoby dla Ciebie najważniejsze?",
        h: "To pytanie zamyka quiz i dotyczy kierunku, w którym chcesz iść.",
        a: [
          { t: "Zbudować życie, w którym nic i nikt nie odbiera mi sprawczości.", s: "Chcę być autorką własnych warunków.", pts: { sabrina: 3, grace: 1 } },
          { t: "Stworzyć przestrzeń, w której mogę być w pełni sobą bez ukrywania.", s: "Najważniejsza jest autentyczność.", pts: { hannah: 3, grace: 1 } },
          { t: "Znaleźć ludzi, z którymi codzienność będzie ciepła, żywa i naprawdę wspólna.", s: "Dla mnie sens rodzi się we współobecności.", pts: { allie: 3, hannah: 1 } },
          { t: "Odzyskać spokój i poczucie, że mogę budować życie bez ciągłego napięcia.", s: "Chcę więcej łagodności, ale nie kosztem prawdy o sobie.", pts: { grace: 3, hannah: 1 } }
        ]
      }
    ];

    let currentQ = 0;
    let scores = { hannah: 0, grace: 0, sabrina: 0, allie: 0 };

    function goTo(step){
      document.querySelectorAll(".step").forEach(el => el.classList.remove("active"));

      if(step === 0){
        document.getElementById("step-0").classList.add("active");
      } else if(step === "result"){
        document.getElementById("step-result").classList.add("active");
      } else {
        document.getElementById("step-quiz").classList.add("active");
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startQuiz(){
      resetQuiz();
      goTo(1);
      renderQuestion();
    }

    function resetQuiz(){
      currentQ = 0;
      scores = { hannah: 0, grace: 0, sabrina: 0, allie: 0 };
    }

    function renderQuestion(){
      const q = QUESTIONS[currentQ];
      const total = QUESTIONS.length;
      const pct = Math.round((currentQ / total) * 100);

      document.getElementById("q-counter").textContent = `Pytanie ${currentQ + 1} z ${total}`;
      document.getElementById("q-pct").textContent = `${pct}%`;
      document.getElementById("progress-fill").style.width = `${pct}%`;

      document.getElementById("question-area").innerHTML = `
        <div class="q-label">Off-Campus · Pytanie ${currentQ + 1}</div>
        <div class="q-title">${q.p}</div>
        <p class="q-hint">${q.h}</p>
        <div class="answers">
          ${q.a.map((ans, i) => `
            <button class="answer" onclick="pickAnswer(${i})">
              ${ans.t}
              <span>${ans.s}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function pickAnswer(index){
      const answer = QUESTIONS[currentQ].a[index];

      Object.entries(answer.pts).forEach(([key, value]) => {
        scores[key] += value;
      });

      currentQ += 1;

      if(currentQ < QUESTIONS.length){
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult(){
      const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const [winnerKey, winnerScore] = sorted[0];
      const winner = CHARACTERS[winnerKey];
      const second = sorted[1];
      const tie = second && second[1] === winnerScore;

      document.getElementById("result-img").src = winner.image;
      document.getElementById("result-img").alt = winner.imageAlt;
      document.getElementById("result-name").textContent = winner.name;
      document.getElementById("result-desc").textContent = winner.desc;
      document.getElementById("result-extra").textContent =
        winner.extra +
        (tie
          ? " Twój wynik jest bardzo wyrównany — masz w sobie też wyraźny rys drugiej bohaterki."
          : " To właśnie ta bohaterka najmocniej wybrzmiała w Twoich odpowiedziach.");

      document.getElementById("result-traits").innerHTML =
        winner.traits.map(trait => `<span class="trait">${trait}</span>`).join("");

      const maxScore = Math.max(...Object.values(scores), 1);

      document.getElementById("score-list").innerHTML = sorted.map(([key, val]) => {
        const width = Math.max(8, (val / maxScore) * 100);
        return `
          <div class="score-item">
            <div class="score-head">
              <strong>${CHARACTERS[key].short}</strong>
              <span>${val} pkt</span>
            </div>
            <div class="score-track">
              <div class="score-fill" style="width:${width}%"></div>
            </div>
          </div>
        `;
      }).join("");

      goTo("result");
    }
  </script>
